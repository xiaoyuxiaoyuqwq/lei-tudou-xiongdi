<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>星潮幸存者 · Starfall Survivors</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305060f'/%3E%3Cpath d='M16 4 L26 26 L16 21 L6 26 Z' fill='%2322d3ee'/%3E%3C/svg%3E" />
<style>
/* ============================================================
   样式：赛博霓虹 · 深空底 + 青/品红/琥珀/紫
   ============================================================ */
:root{
  --bg:#05060f; --cyan:#22d3ee; --pink:#f472b6; --amber:#fbbf24; --purple:#a78bfa;
  --ink:#e6f6ff; --dim:#7b8ba3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
canvas{display:block;position:fixed;inset:0}

/* HUD 根层：默认穿透点击 */
#ui{position:fixed;inset:0;pointer-events:none;user-select:none}
.hide{display:none !important}

/* ---- 顶部条：计时 / 波次 / 击杀 ---- */
#topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;
  align-items:center;gap:28px;padding:10px 16px;
  background:linear-gradient(180deg,rgba(5,6,15,.85),transparent)}
#timer{font-size:30px;font-weight:700;letter-spacing:2px;color:var(--ink);
  text-shadow:0 0 12px rgba(34,211,238,.75);font-variant-numeric:tabular-nums}
.chip{font-size:13px;color:var(--dim);letter-spacing:1px}
.chip b{color:var(--cyan);font-size:17px;margin-left:6px;font-variant-numeric:tabular-nums}
.chip.k b{color:var(--pink)}

/* ---- 经验条（顶部通栏） ---- */
#expwrap{position:absolute;top:0;left:0;right:0;height:6px;background:rgba(255,255,255,.07)}
#expbar{height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--purple));
  box-shadow:0 0 14px var(--cyan);transition:width .12s linear}
#lvbadge{position:absolute;top:10px;left:16px;font-size:12px;color:var(--dim);letter-spacing:1px}
#lvbadge b{color:var(--purple);font-size:20px;margin-left:6px}

/* ---- 左下：血条 ---- */
#vitals{position:absolute;left:18px;bottom:18px;width:260px}
.barrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.barlbl{font-size:11px;width:26px;color:var(--dim);letter-spacing:1px}
.bar{flex:1;height:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;transition:width .15s ease-out}
#hpfill{background:linear-gradient(90deg,#f43f5e,var(--pink));box-shadow:0 0 12px rgba(244,114,182,.7)}
#shfill{background:linear-gradient(90deg,var(--cyan),#67e8f9);box-shadow:0 0 12px rgba(34,211,238,.7)}
.barnum{font-size:12px;width:56px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}

/* ---- 右下：武器 / 僚机 图标栏 ---- */
#loadout{position:absolute;right:18px;bottom:18px;display:flex;flex-direction:column;
  align-items:flex-end;gap:6px}
.slotrow{display:flex;gap:5px}
.slot{width:38px;height:38px;border:1px solid rgba(255,255,255,.16);border-radius:5px;
  background:rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-size:15px;position:relative}
.slot small{position:absolute;right:2px;bottom:0;font-size:9px;color:var(--amber);font-weight:700}
.slot.evo{border-color:var(--amber);box-shadow:0 0 10px rgba(251,191,36,.5)}

/* ---- 升级选卡弹窗 ---- */
#levelup{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:rgba(5,6,15,.86);backdrop-filter:blur(3px);pointer-events:auto}
#lvtitle{font-size:15px;letter-spacing:6px;color:var(--cyan);margin-bottom:6px}
#lvsub{font-size:12px;color:var(--dim);margin-bottom:26px;letter-spacing:2px}
#cards{display:flex;gap:18px}
.card{width:216px;padding:20px 18px;border:1px solid rgba(255,255,255,.18);border-radius:8px;
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  cursor:pointer;transition:transform .13s,box-shadow .13s,border-color .13s;text-align:center}
.card:hover{transform:translateY(-7px);border-color:var(--cyan);
  box-shadow:0 10px 34px rgba(34,211,238,.28)}
.card .ico{font-size:36px;margin-bottom:12px}
.card .nm{font-size:16px;font-weight:700;margin-bottom:4px}
.card .lv{font-size:11px;color:var(--amber);margin-bottom:10px;letter-spacing:1px}
.card .ds{font-size:12px;line-height:1.65;color:var(--dim)}
.card .rar{margin-top:12px;font-size:10px;letter-spacing:2px}
.r-n{color:var(--dim)} .r-r{color:var(--cyan)} .r-e{color:var(--purple)} .r-v{color:var(--amber)}
.card.c-r{border-color:rgba(34,211,238,.45)}
.card.c-e{border-color:rgba(167,139,250,.5)}
.card.c-v{border-color:rgba(251,191,36,.62);box-shadow:0 0 20px rgba(251,191,36,.22)}

/* ---- 开场 / 结算 ---- */
#screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:rgba(5,6,15,.93);pointer-events:auto;text-align:center}
#sTitle{font-size:52px;font-weight:800;letter-spacing:10px;
  background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
#sSub{font-size:13px;color:var(--dim);letter-spacing:3px;margin-bottom:30px}
#sStats{font-size:13px;color:var(--ink);line-height:2.1;margin-bottom:28px;
  font-variant-numeric:tabular-nums}
#sStats span{color:var(--cyan);font-weight:700;margin-left:8px}
.btn{pointer-events:auto;padding:13px 40px;font-size:15px;letter-spacing:3px;cursor:pointer;
  border:1px solid var(--cyan);border-radius:4px;background:rgba(34,211,238,.1);color:var(--cyan);
  transition:.15s;margin:0 6px;font-family:inherit}
.btn:hover{background:var(--cyan);color:var(--bg);box-shadow:0 0 24px rgba(34,211,238,.55)}
.btn.alt{border-color:var(--amber);color:var(--amber);background:rgba(251,191,36,.1)}
.btn.alt:hover{background:var(--amber);color:var(--bg);box-shadow:0 0 24px rgba(251,191,36,.55)}
#help{font-size:12px;color:var(--dim);line-height:2;margin-top:26px;letter-spacing:1px}
#help b{color:var(--cyan)}

/* ---- 波次提示 ---- */
#wavetip{position:absolute;top:44%;left:0;right:0;text-align:center;font-size:36px;
  font-weight:800;letter-spacing:8px;opacity:0;color:var(--pink);
  text-shadow:0 0 30px rgba(244,114,182,.9)}
#wavetip.show{animation:wt 2.2s ease-out}
@keyframes wt{0%{opacity:0;transform:scale(.8)}18%{opacity:1;transform:scale(1)}
  72%{opacity:1}100%{opacity:0;transform:scale(1.06)}}

/* ---- BOSS 血条 ---- */
#bossbar{position:absolute;top:52px;left:50%;transform:translateX(-50%);width:min(620px,74vw)}
#bossname{font-size:12px;letter-spacing:4px;color:var(--pink);margin-bottom:5px;text-align:center}
#bosshpwrap{height:11px;background:rgba(255,255,255,.09);border:1px solid rgba(244,114,182,.45)}
#bosshp{height:100%;width:100%;background:linear-gradient(90deg,var(--pink),var(--purple));
  box-shadow:0 0 16px rgba(244,114,182,.75);transition:width .18s}
#bossphase{display:flex;gap:4px;margin-top:4px;justify-content:center}
.pdot{width:26px;height:3px;background:rgba(255,255,255,.2)}
.pdot.on{background:var(--pink);box-shadow:0 0 8px var(--pink)}

/* ---- 增益提示 ---- */
#buffs{position:absolute;left:18px;bottom:80px;display:flex;flex-direction:column;gap:4px}
.buff{font-size:11px;letter-spacing:1px;color:var(--amber);
  background:rgba(251,191,36,.12);border-left:2px solid var(--amber);padding:3px 8px}
#fps{position:absolute;right:14px;top:10px;font-size:11px;color:var(--dim);
  font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="ui">
  <div id="expwrap"><div id="expbar"></div></div>
  <div id="lvbadge">LV<b id="lvnum">1</b></div>
  <div id="fps"></div>

  <div id="topbar">
    <div class="chip">WAVE<b id="wavenum">1</b></div>
    <div id="timer">15:00</div>
    <div class="chip k">KILL<b id="killnum">0</b></div>
  </div>

  <div id="bossbar" class="hide">
    <div id="bossname">DREADNOUGHT · 母舰</div>
    <div id="bosshpwrap"><div id="bosshp"></div></div>
    <div id="bossphase"><i class="pdot on"></i><i class="pdot"></i><i class="pdot"></i></div>
  </div>

  <div id="wavetip"></div>
  <div id="buffs"></div>

  <div id="vitals">
    <div class="barrow"><span class="barlbl">HP</span>
      <div class="bar"><i id="hpfill"></i></div><span class="barnum" id="hpnum">100/100</span></div>
    <div class="barrow"><span class="barlbl">SH</span>
      <div class="bar"><i id="shfill" style="width:0%"></i></div>
      <span class="barnum" id="shnum">0</span></div>
  </div>

    <div class="slotrow" id="wslots"></div>
    <div class="slotrow" id="pslots"></div>

    <div id="lvtitle">L E V E L   U P</div>
    <div id="lvsub">选择一项强化</div>
    <div id="cards"></div>
  </div>

  <div id="screen">
    <div id="sTitle">星潮幸存者</div>
    <div id="sSub">S T A R F A L L   S U R V I V O R S</div>
    <div id="sStats" class="hide"></div>
    <div>
      <button class="btn" id="btnStart">开 始 出 击</button>
      <button class="btn alt hide" id="btnEndless">无 尽 模 式</button>
    </div>
    <div id="help">
      <b>WASD / 方向键</b> 移动 &nbsp;·&nbsp; 武器<b>全自动</b>索敌开火 &nbsp;·&nbsp; <b>数字键 1/2/3</b> 选卡<br>
      <b>空格</b> 暂停 &nbsp;·&nbsp; <b>F</b> 切换舰队阵型 &nbsp;·&nbsp; 存活 15 分钟击破母舰即为通关
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="assets/assets.js"></script>
<script>
"use strict";
/* ============================================================================
 * 星潮幸存者 Starfall Survivors — 单文件 three.js 原型
 * 依赖：three r160 UMD（全局 THREE），无 ES Module，可 file:// 双击运行
 * 模块顺序（单向依赖，低层不引用高层）：
 *   CFG → Util → Gfx → Pool → Grid → World → Input → Player
 *   → Bullets → Weapons → Enemies → Boss → Wingmen → Loot
 *   → Progress → HUD → Game
 * ==========================================================================*/

/* ============================================================================
 * [0] CFG — 数值总表。所有可调参数集中于此，改数值无需碰逻辑。
 * ==========================================================================*/
const CFG = {
  // ---- 世界 / 相机 ----
  CAM_H: 42, CAM_FOV: 50, CAM_TILT: 20 * Math.PI / 180,
  CAM_LAG: 6.0,            // 相机跟随的指数平滑系数
  SPAWN_R: 46,             // 屏幕外环形刷怪半径
  DESPAWN_R: 46 * 1.6,     // 超出此距离的敌人传送回环上
  CELL: 5,                 // 空间哈希格边长 = 2*(最大敌半径2.2 + 最大弹半径0.3) 向上取整

  // ---- 局内节奏 ----
  WAVE_TIME: 60,           // 每波持续秒数
  WAVE_MAX: 15,            // 标准局波数（第15波为BOSS）
  ELITE_WAVES: [5, 10],    // 精英出现波次

  // ---- 玩家 ----
  P: {
    hp: 100, speed: 12, dmg: 10, rate: 2.5,
    critC: 0.05, critD: 1.5, pickR: 3.0, iframe: 0.6, radius: 0.8
  },

  // ---- 敌机基础属性（未乘波次成长系数）----
  E: {
    charger: { hp: 18, spd: 6.5, dmg: 8,  r: 0.7,  exp: 1, from: 1,  color: 0xf472b6, name: '突击者' },
    orbiter: { hp: 30, spd: 8.0, dmg: 10, r: 0.8,  exp: 2, from: 3,  color: 0x22d3ee, name: '游隼' },
    sniper:  { hp: 22, spd: 4.0, dmg: 12, r: 0.75, exp: 4, from: 5,  color: 0xfbbf24, name: '狙击手' },
    splitter:{ hp: 55, spd: 5.0, dmg: 12, r: 1.1,  exp: 6, from: 7,  color: 0xa78bfa, name: '孢子母舰' },
    mini:    { hp: 8,  spd: 9.0, dmg: 6,  r: 0.45, exp: 1, from: 7,  color: 0xc4b5fd, name: '孢子' },
    elite:   { hp: 900,spd: 5.5, dmg: 20, r: 2.2,  exp: 60,from: 5,  color: 0xffffff, name: '精英' }
  },
  // 各波敌种权重（索引 = wave-1），未列出的类型权重为 0
  WAVE_MIX: [
    { charger:100 }, { charger:100 }, { charger:70, orbiter:30 }, { charger:60, orbiter:40 },
    { charger:45, orbiter:30, sniper:25 }, { charger:40, orbiter:30, sniper:30 },
    { charger:35, orbiter:28, sniper:22, splitter:15 },
    { charger:30, orbiter:25, sniper:25, splitter:20 },
    { charger:25, orbiter:25, sniper:25, splitter:25 },
    { charger:25, orbiter:25, sniper:25, splitter:25 },
    { charger:20, orbiter:30, sniper:28, splitter:22 },
    { charger:20, orbiter:25, sniper:25, splitter:30 },
    { charger:22, orbiter:24, sniper:24, splitter:30 },
    { charger:22, orbiter:24, sniper:24, splitter:30 },
    { charger:25, orbiter:25, sniper:25, splitter:25 }
  ],

  // ---- BOSS ----
  BOSS: { hp: 12000, spd: 4.5, dmg: 25, r: 4.0, exp: 400, name: 'DREADNOUGHT · 母舰' },

  // ---- 经验 ----
  GEM: { small: 1, mid: 5, big: 20, life: 45, blink: 30, maxCount: 700 },

  // ---- 稀有掉落率 ----
  DROP: { nuke: 0.0015, repair: 0.012, repairLow: 0.035, overdrive: 0.008,
          magnet: 0.006, barrier: 0.005 },

  // ---- 对象池容量（池满即丢弃，绝不动态扩容）----
  POOL: { enemy: 200, pbullet: 500, ebullet: 300, missile: 60, gem: 800, fx: 48, item: 24, kill: 300 },

  // ---- 僚机 ----
  WING: { maxCount: 3, dpsCapRatio: 0.25, followSmooth: 8, spread: 0.5, dist: 2.6 }
};

/* ---- 武器数值表：index 0 = Lv1 ---- */
const WEAPONS = {
  cannon: {
    name: '脉冲主炮', icon: '✦', evoName: '新星连射', evoIcon: '✸', evoPassive: 'rate',
    lv: [
      { dmg: 10, rate: 2.5, count: 1, spread: 0,    spd: 30 },
      { dmg: 13, rate: 2.8, count: 1, spread: 0,    spd: 30 },
      { dmg: 16, rate: 3.1, count: 2, spread: 0.10, spd: 32 },
      { dmg: 20, rate: 3.4, count: 2, spread: 0.10, spd: 32 },
      { dmg: 25, rate: 3.8, count: 3, spread: 0.17, spd: 34 }
    ],
    evo: { dmg: 30, rate: 4.5, count: 5, spread: 0.31, spd: 36, pierce: 1 }
  },
  missile: {
    name: '追踪导弹', icon: '➤', evoName: '蜂群齐射', evoIcon: '⁂', evoPassive: 'crit',
    lv: [
      { dmg: 25, rate: 1/1.2, count: 1, blast: 2.0, turn: 3.14 },
      { dmg: 32, rate: 1/1.1, count: 1, blast: 2.2, turn: 3.32 },
      { dmg: 40, rate: 1/1.0, count: 2, blast: 2.4, turn: 3.49 },
      { dmg: 50, rate: 1/0.9, count: 2, blast: 2.8, turn: 3.67 },
      { dmg: 62, rate: 1/0.8, count: 3, blast: 3.2, turn: 3.84 }
    ],
    evo: { dmg: 75, rate: 1.0, count: 6, blast: 4.0, turn: 4.2 }
  },
  laser: {
    name: '棱镜光矛', icon: '⌁', evoName: '三棱光矛', evoIcon: '※', evoPassive: 'speed',
    lv: [
      { dps: 30, w: 0.6, len: 22, dur: 0.5, cd: 1.5, beams: 1 },
      { dps: 42, w: 0.7, len: 26, dur: 0.6, cd: 1.4, beams: 1 },
      { dps: 55, w: 0.8, len: 30, dur: 0.7, cd: 1.3, beams: 1 },
      { dps: 72, w: 1.0, len: 34, dur: 0.8, cd: 1.2, beams: 1 },
      { dps: 95, w: 1.2, len: 40, dur: 1.0, cd: 1.1, beams: 1 }
    ],
    evo: { dps: 120, w: 1.3, len: 42, dur: 1.1, cd: 1.1, beams: 3 }
  },
  aura: {
    name: '斥力立场', icon: '◎', evoName: '奇点立场', evoIcon: '⊛', evoPassive: 'hp',
    lv: [
      { dps: 12, r: 4.0, slow: 0,    pull: 0 },
      { dps: 17, r: 4.6, slow: 0,    pull: 0 },
      { dps: 23, r: 5.2, slow: 0.15, pull: 0 },
      { dps: 30, r: 6.0, slow: 0.15, pull: 0 },
      { dps: 40, r: 7.0, slow: 0.15, pull: -3 }
    ],
    evo: { dps: 70, r: 8.0, slow: 0.2, pull: 2 }
  }
};

/* ---- 被动数值表 ---- */
const PASSIVES = {
  speed: { name: '推进器', icon: '⇈', max: 5, per: 0.08, desc: L => `移动速度 +${L*8}%` },
  rate:  { name: '冷却器', icon: '❄', max: 5, per: 0.07, desc: L => `攻击间隔 -${Math.round((1-1/(1+0.07*L))*100)}%` },
  crit:  { name: '瞄准镜', icon: '◈', max: 5, per: 0.04, desc: L => `暴击率 +${L*4}% / 暴伤 +${L*15}%` },
  pick:  { name: '磁力场', icon: '⊙', max: 5, per: 0.25, desc: L => `拾取范围 +${L*25}%` },
  hp:    { name: '装甲板', icon: '❤', max: 5, per: 20,   desc: L => `最大生命 +${L*20}（立即回复）` },
  armor: { name: '复合装甲', icon: '⛨', max: 5, per: 2,  desc: L => `伤害减免 ${L*2} 点` }
};

/* ---- 僚机机型 ---- */
const WINGTYPES = {
  striker:  { name: '突击僚机', icon: '▲', dmg: 6,  rate: 2.0, target: 'near', color: 0x22d3ee,
              desc: '锁定最近敌人高频点射' },
  warden:   { name: '守护僚机', icon: '⬢', dmg: 0,  rate: 0.25, target: null,  color: 0x86efac,
              desc: '每 4 秒为母机充能 1 层护盾，并提升拾取范围' },
  howitzer: { name: '重炮僚机', icon: '⬣', dmg: 22, rate: 0.6, target: 'far',  color: 0xfbbf24,
              desc: '低频高伤，炮弹命中后产生范围爆炸' }
};

/* ============================================================================
 * [1] Util — 数学工具 + 临时向量复用池（热路径严禁 new）
 * ==========================================================================*/
const Util = {
  TMP: { v1:new THREE.Vector3(), v2:new THREE.Vector3(), v3:new THREE.Vector3(),
         q1:new THREE.Quaternion(), e1:new THREE.Euler(), m1:new THREE.Matrix4(),
         c1:new THREE.Color(), c2:new THREE.Color() },
  clamp: (v,a,b) => v < a ? a : (v > b ? b : v),
  lerp:  (a,b,t) => a + (b - a) * t,
  rand:  (a,b) => a + Math.random() * (b - a),
  randInt:(a,b) => (a + Math.random() * (b - a + 1)) | 0,
  // 帧率无关的指数平滑：把 "每秒收敛率" 转成本帧插值系数
  smooth:(k,dt) => 1 - Math.exp(-k * dt),
  // 角度归一化到 [-PI, PI]，用于导弹转向
  wrapPI:(a) => Math.atan2(Math.sin(a), Math.cos(a)),
  // 缓出三次：进场/缩放演出用
  easeOutCubic:(t) => 1 - Math.pow(1 - t, 3),
  // 按权重对象 {key:weight} 抽取一个 key
  pickWeighted(map){
    let total = 0;
    for (const k in map) total += map[k];
    let r = Math.random() * total;
    for (const k in map){ r -= map[k]; if (r <= 0) return k; }
    return Object.keys(map)[0];
  },
  fmtTime(s){
    s = Math.max(0, s | 0);
    const m = (s / 60) | 0, ss = s % 60;
    return m + ':' + (ss < 10 ? '0' : '') + ss;
  }
};

/* ============================================================================
 * [2] Gfx — 程序化贴图与共享几何/材质工厂
 *   file:// 下无法加载外部图片，全部用 CanvasTexture 现场生成。
 *   无 EffectComposer，辉光靠 AdditiveBlending 三层叠加模拟。
 * ==========================================================================*/
const Gfx = {
  tex: {}, geo: {}, mat: {}, atx: {},
  // 精灵朝向偏移：Kenney 素材机头朝纹理上方，需旋到世界运动方向
  SHIP_ROT: Math.PI,

  init(){
    this.tex.glow  = this._radialTex(128, 'rgba(255,255,255,1)', 0.0);
    this.tex.spark = this._radialTex(64,  'rgba(255,255,255,1)', 0.45);
    this.tex.star  = this._starTex(64);
    this.tex.shadow = this._shadowTex(128);

    // ---- 共享几何：全部只建一次 ----
    this.geo.bullet  = new THREE.SphereGeometry(0.26, 6, 5);
    this.geo.ebullet = new THREE.SphereGeometry(0.3, 6, 5);
    this.geo.missile = new THREE.ConeGeometry(0.2, 0.9, 6);
    this.geo.gem     = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);  // 平铺星标（配合 star1 贴图）
    this.geo.charger = new THREE.ConeGeometry(0.7, 1.7, 4);
    this.geo.orbiter = new THREE.TetrahedronGeometry(0.9, 0);
    this.geo.sniper  = new THREE.CylinderGeometry(0.1, 0.78, 1.3, 5);
    this.geo.splitter= new THREE.DodecahedronGeometry(1.05, 0);
    this.geo.mini    = new THREE.TetrahedronGeometry(0.46, 0);
    this.geo.elite   = new THREE.IcosahedronGeometry(2.0, 0);
    this.geo.quad    = new THREE.PlaneGeometry(1, 1);
    this.geo.shadow  = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);  // 贴地软阴影

    // 导弹/子弹的圆锥默认朝 +Y，旋转到 +Z 便于用朝向角驱动
    this.geo.missile.rotateX(Math.PI / 2);
    this.geo.charger.rotateX(Math.PI / 2);
    this.geo.sniper.rotateX(Math.PI / 2);

    // ---- 飞船部件库（每个只建一次，全模型共享几何）----
    const P = this.parts = {};
    P.fuse   = (o => { o.rotateX(Math.PI / 2); return o; })(new THREE.ConeGeometry(0.34, 1.35, 4));
    P.fuseS  = (o => { o.rotateX(Math.PI / 2); return o; })(new THREE.ConeGeometry(0.26, 1.0, 4));
    P.wing   = new THREE.BoxGeometry(0.95, 0.07, 0.34);
    P.fin    = new THREE.BoxGeometry(0.09, 0.36, 0.28);
    P.barrel = (o => { o.rotateX(Math.PI / 2); return o; })(new THREE.CylinderGeometry(0.07, 0.07, 1.1, 6));
    P.ring   = new THREE.TorusGeometry(0.62, 0.05, 6, 20);
    P.ringL  = new THREE.TorusGeometry(1.05, 0.06, 6, 24);
    P.spike  = (o => { o.rotateX(Math.PI / 2); return o; })(new THREE.ConeGeometry(0.1, 0.5, 4));
    P.pod    = new THREE.IcosahedronGeometry(0.55, 0);
    P.hub    = new THREE.OctahedronGeometry(0.5, 0);
    P.disc   = new THREE.CylinderGeometry(0.6, 0.6, 0.16, 16);
    P.core   = new THREE.SphereGeometry(0.3, 10, 8);
    P.turret = (o => { o.translate(0, 0, 0.3); return o; })(new THREE.BoxGeometry(0.22, 0.22, 0.5));
  },

  // 径向渐变圆：中心不透明 → 边缘透明，辉光的基础素材
  _radialTex(size, core, mid){
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    grd.addColorStop(0, core);
    grd.addColorStop(Math.max(0.01, mid), 'rgba(255,255,255,0.42)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.fillRect(0, 0, size, size);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  },

  // 四芒星：星尘背景用
  _starTex(size){
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'); const h = size / 2;
    const grd = g.createRadialGradient(h, h, 0, h, h, h);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.3, 'rgba(255,255,255,0.5)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(h, h, h, 0, 6.283); g.fill();
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  },

  // 软阴影遮罩：中心浓 → 边缘透明，供地面投影复用
  _shadowTex(size){
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'); const h = size / 2;
    const grd = g.createRadialGradient(h, h, 0, h, h, h);
    grd.addColorStop(0,   'rgba(255,255,255,0.92)');
    grd.addColorStop(0.55,'rgba(255,255,255,0.45)');
    grd.addColorStop(1,   'rgba(255,255,255,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(h, h, h, 0, 6.283); g.fill();
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  },

  // 加色混合的光晕 Sprite —— 霓虹感主力
  glowSprite(color, size, opacity){
    const m = new THREE.SpriteMaterial({
      map: this.tex.glow, color: color, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false,
      opacity: opacity === undefined ? 0.85 : opacity
    });
    const s = new THREE.Sprite(m);
    s.scale.set(size, size, 1);
    s.renderOrder = 10;
    return s;
  },

  // 实体基础材质（自发光平涂，配合外壳产生霓虹描边）
  solidMat(color){
    return new THREE.MeshBasicMaterial({ color: color });
  },

  // BackSide 外扩壳体：廉价 Fresnel 描边
  shellMesh(geo, color, scale, opacity){
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color: color, side: THREE.BackSide, transparent: true,
      opacity: opacity === undefined ? 0.35 : opacity,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    m.scale.setScalar(scale || 1.18);
    m.renderOrder = 9;
    return m;
  },

  // 地面投影：2.5D 立体感的关键。让扁平精灵"踩"在星域平面上，
  // 而非悬浮。共享几何 + 独立材质（便于 Wingmen/Boss dispose 安全）。
  groundShadow(scale, opacity, color){
    const m = new THREE.Mesh(this.geo.shadow, new THREE.MeshBasicMaterial({
      map: this.tex.shadow, color: (color === undefined ? 0x000010 : color),
      transparent: true, opacity: (opacity === undefined ? 0.42 : opacity),
      depthWrite: false
    }));
    m.scale.set(scale, 1, scale);
    m.position.y = 0.02;          // 略高于地面，避免 z-fighting
    m.renderOrder = 0;
    return m;
  },

  // ---- 网络素材（Kenney CC0）接入：base64 data URI，WebGL 安全 ----
  // 精灵朝向偏移在 SHIP_ROT 中统一调整
  assetTex(key){
    if (!window.ASSETS || !window.ASSETS[key]) return null;
    if (this.atx[key]) return this.atx[key];
    const img = new Image();
    img.src = window.ASSETS[key];
    const t = new THREE.Texture(img);
    t.colorSpace = THREE.SRGBColorSpace;
    t.needsUpdate = true;                         // 先传一次（空白），加载完再刷
    img.onload = () => { t.needsUpdate = true; };
    this.atx[key] = t;
    return t;
  },

  // 通用广告牌精灵（始终面向相机）
  billboard(key, color, scale, blend, op){
    const m = new THREE.SpriteMaterial({
      map: this.assetTex(key), color: color,
      transparent: true, blending: blend || THREE.NormalBlending,
      depthWrite: false, opacity: op === undefined ? 1 : op
    });
    const s = new THREE.Sprite(m);
    s.scale.set(scale, scale, 1);
    s.renderOrder = 6;
    return s;
  },

  // 飞船精灵：白色剪影 → 用 color 染成霓虹色，受击可闪白
  shipSprite(key, color, scale){
    return this.billboard(key, color, scale, THREE.NormalBlending, 1);
  },

  /* 组合式飞船建模：返回 { g:Group(朝向 +Z), mats:[可闪白/复色材质] }
     全部来自 parts 共享几何，材质按实例创建以便独立受击闪白 */
  build(kind, color){
    const P = this.parts, g = new THREE.Group(), mats = [];
    const M = c => { const m = this.solidMat(c); mats.push(m); return m; };
    const A = c => this.solidMat(c);                       // 固定装饰色，不参与闪白
    const mesh = (geo, mat, px,py,pz, rx,ry,rz) => {
      const me = new THREE.Mesh(geo, mat);
      if (px !== undefined) me.position.set(px, py, pz);
      if (rx || ry || rz) me.rotation.set(rx || 0, ry || 0, rz || 0);
      g.add(me); return me;
    };
    // 内嵌描边：每个部件都套一层 BackSide 外扩壳，制造霓虹体积感
    const rim = (geo, col, sc, op) => { g.add(this.shellMesh(geo, col, sc, op)); };
    // 引擎块：尾部小块，给机体一点厚度与方向感
    const engine = (col, z) => {
      const e = mesh(P.hub, A(col), 0, 0, z); e.scale.set(0.5, 0.4, 0.4); return e;
    };

    switch (kind){
      case 'charger': {                 // 突击者：尖镖 + 双掠翼 + 立尾
        const m = M(color); mesh(P.fuse, m);
        const w = M(color);
        mesh(P.wing, w, -0.33, 0, -0.18, 0, 0,  0.28);
        mesh(P.wing, w,  0.33, 0, -0.18, 0, 0, -0.28);
        const f = M(color); mesh(P.fin, f, 0, 0.16, -0.42);
        engine(0x0ea5b7, -0.92);
        rim(P.fuse, color, 1.25, 0.30); break;
      }
      case 'orbiter': {                 // 游隼：扁平机身 + 掠翼
        const m = M(color); const b = mesh(P.hub, m); b.scale.set(1.25, 0.42, 0.62);
        const w = M(color);
        mesh(P.wing, w, -0.42, 0, 0, 0, 0,  0.32);
        mesh(P.wing, w,  0.42, 0, 0, 0, 0, -0.32);
        engine(color, -0.7);
        rim(P.hub, color, 1.5, 0.28); break;
      }
      case 'sniper': {                  // 狙击手：长管炮舰
        const m = M(color); mesh(P.fuse, m);
        mesh(P.barrel, m, 0, 0, 0.72);
        const w = M(color);
        mesh(P.wing, w, -0.30, 0, -0.30, 0, 0,  0.20);
        mesh(P.wing, w,  0.30, 0, -0.30, 0, 0, -0.20);
        engine(0x0ea5b7, -0.92);
        rim(P.fuse, color, 1.22, 0.30); break;
      }
      case 'splitter': {                // 孢子母舰：球荚 + 尖刺环 + 白核
        const m = M(color); mesh(P.pod, m);
        for (let i = 0; i < 7; i++){ const a = i/7*6.283; const sm = M(color);
          mesh(P.spike, sm, Math.cos(a)*0.6, 0, Math.sin(a)*0.6, 0, a, 0); }
        mesh(P.core, A(0xffffff), 0, 0, 0);
        engine(color, -0.55);
        rim(P.pod, color, 1.3, 0.30); break;
      }
      case 'mini': {                    // 孢子：小核
        const m = M(color); mesh(P.hub, m); rim(P.hub, color, 1.3, 0.30); break;
      }
      case 'elite': {                   // 精英：核心 + 旋转环 + 尖刺 + 白核
        const m = M(color); mesh(P.hub, m);
        const r = M(color); const rg = mesh(P.ringL, r); rg.rotation.x = Math.PI/2.3;
        for (let i = 0; i < 10; i++){ const a = i/10*6.283; const sm = M(color);
          mesh(P.spike, sm, Math.cos(a)*0.85, 0, Math.sin(a)*0.85, 0, a, 0); }
        mesh(P.core, A(0xffffff), 0, 0, 0);
        engine(0xfbbf24, -0.7);
        rim(P.hub, color, 1.35, 0.32); break;
      }
      case 'player': {                  // 玩家战机：fuselage + 掠翼 + 立尾 + 座舱 + 尾喷
        const m = M(0x22d3ee); mesh(P.fuse, m);
        const w = M(0x0ea5b7);
        mesh(P.wing, w, -0.42, 0, -0.12, 0, 0,  0.42);
        mesh(P.wing, w,  0.42, 0, -0.12, 0, 0, -0.42);
        const f = M(0x0ea5b7); mesh(P.fin, f, 0, 0.18, -0.45);
        mesh(P.core, M(0x9becff), 0, 0.12, 0.1);
        engine(0x67e8f9, -0.95);
        rim(P.fuse, 0x67e8f9, 1.28, 0.32); break;
      }
      case 'striker': {                 // 突击僚机
        const m = M(color); mesh(P.fuseS, m);
        const w = M(color);
        mesh(P.wing, w, -0.30, 0, -0.12, 0, 0,  0.30);
        mesh(P.wing, w,  0.30, 0, -0.12, 0, 0, -0.30);
        engine(color, -0.7);
        rim(P.fuseS, color, 1.3, 0.32); break;
      }
      case 'warden': {                  // 守护僚机：圆盘 + 环
        const m = M(color); mesh(P.disc, m);
        const r = M(color); const rg = mesh(P.ring, r); rg.rotation.x = Math.PI/2;
        engine(color, -0.18);
        rim(P.disc, color, 1.25, 0.30); break;
      }
      case 'howitzer': {                // 重炮僚机
        const m = M(color); mesh(P.fuseS, m);
        mesh(P.barrel, m, 0, 0, 0.55);
        const w = M(color);
        mesh(P.wing, w, -0.30, 0, -0.25, 0, 0,  0.18);
        mesh(P.wing, w,  0.30, 0, -0.25, 0, 0, -0.18);
        engine(color, -0.7);
        rim(P.fuseS, color, 1.3, 0.30); break;
      }
      default: {
        const m = M(color || 0xffffff); mesh(P.core, m);
      }
    }
    return { g, mats };
  },

  /* BOSS 母舰模型：装甲舰体 + 脉冲能量核心 + 三层环 + 炮塔环 + 能量链接弧 + 光晕 */
  buildBoss(){
    const P = this.parts, g = new THREE.Group();

    // 装甲舰体：压扁八面体，半透加色，给旗舰体积感（BOSS 是唯一的真 3D 建模）
    const hull = new THREE.Mesh(new THREE.OctahedronGeometry(4.0, 0),
      new THREE.MeshBasicMaterial({ color: 0x7c3aed, transparent: true, opacity: 0.42,
        blending: THREE.AdditiveBlending, depthWrite: false }));
    hull.scale.set(1, 0.5, 1); g.add(hull);
    const hullShell = this.shellMesh(new THREE.OctahedronGeometry(4.0, 0), 0xa78bfa, 1.12, 0.28);
    hullShell.scale.set(1, 0.5, 1); g.add(hullShell);

    // 能量核心：实心 + 外壳 + 呼吸光晕
    const core = new THREE.Mesh(new THREE.IcosahedronGeometry(3.0, 1), this.solidMat(0xf472b6));
    g.add(core);
    g.add(this.shellMesh(new THREE.IcosahedronGeometry(3.0, 1), 0xa78bfa, 1.22, 0.42));
    const coreGlow = this.glowSprite(0xf472b6, 9, 0.6);
    g.add(coreGlow);

    // 四层偏转环（外环最恢弘，缓慢逆向旋转）
    const ringDefs = [
      [5.2, 0.22, Math.PI/2,   0xa78bfa, 0.8],
      [6.6, 0.14, Math.PI/2.3, 0xf472b6, 0.6],
      [4.2, 0.10, Math.PI/3,   0xffffff, 0.5],
      [8.6, 0.10, Math.PI/2.6, 0xa78bfa, 0.32]
    ];
    const rings = [];
    for (const [R,t,rx,col,op] of ringDefs){
      const r = new THREE.Mesh(new THREE.TorusGeometry(R,t,8,44),
        new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:op,
          blending:THREE.AdditiveBlending, depthWrite:false }));
      r.rotation.x = rx; g.add(r); rings.push(r);
    }

    // 8 座炮塔（独立几何，dispose 安全）
    const turrets = [];
    for (let i = 0; i < 8; i++){
      const a = i/8*6.283;
      const t = new THREE.Mesh(P.turret.clone(), this.solidMat(0xfbbf24));
      t.position.set(Math.cos(a)*4.6, 0, Math.sin(a)*4.6); t.rotation.y = a;
      g.add(t); turrets.push(t);
    }

    // 8 道能量链接弧：核心 ↔ 炮塔 之间的脉动光束（加色辉光）
    const arcs = [];
    for (let i = 0; i < 8; i++){
      const a = i/8*6.283;
      const ar = this.glowSprite(0xfbbf24, 2.2, 0.7);
      ar.position.set(Math.cos(a)*2.3, 0, Math.sin(a)*2.3);
      g.add(ar); arcs.push(ar);
    }

    // 贴地投影（独立几何/材质，clear 释放安全）
    const bsGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
    const bshadow = new THREE.Mesh(bsGeo, new THREE.MeshBasicMaterial({
      map: this.tex.shadow, color: 0x05010a, transparent: true, opacity: 0.5, depthWrite: false }));
    bshadow.scale.set(9, 1, 9); bshadow.position.y = 0.02; bshadow.renderOrder = 0;
    g.add(bshadow);

    g.add(this.glowSprite(0xf472b6, 20, 0.4));
    return { g, core, coreGlow, hull, rings, ring1: rings[0], ring2: rings[1], turrets, arcs };
  }
};

/* ============================================================================
 * [3] Pool — 通用对象池。活跃对象用紧凑数组 + swap-remove 实现 O(1) 回收。
 * ==========================================================================*/
const Pool = {
  create(factory, reset, cap){
    const items = new Array(cap), active = [], free = new Array(cap);
    for (let i = 0; i < cap; i++){
      const o = factory(i); o._idx = -1; o.alive = false;
      items[i] = o; free[i] = o;
    }
    let freeTop = cap;
    return {
      items, active, cap,
      get count(){ return active.length; },
      acquire(){
        if (freeTop === 0) return null;      // 池满：直接丢弃，不扩容（防内存尖刺）
        const o = free[--freeTop];
        o._idx = active.length; active.push(o);
        o.alive = true;
        if (reset) reset(o);
        return o;
      },
      release(o){
        if (o._idx < 0) return;              // 已回收，防重复释放
        const last = active.pop();
        if (last !== o){ last._idx = o._idx; active[o._idx] = last; }
        o._idx = -1; o.alive = false;
        if (o.mesh) o.mesh.visible = false;
        free[freeTop++] = o;
      },
      releaseAll(){
        for (let i = active.length - 1; i >= 0; i--) this.release(active[i]);
      }
    };
  }
};

/* ============================================================================
 * [4] Grid — 均匀网格空间哈希，只索引敌人（敌人是被查询方）
 *   暴力 120敌×300弹 = 3.6万对/帧 ≈ 3ms 不可接受；
 *   哈希后平均 ~1000 对/帧 < 0.3ms。
 * ==========================================================================*/
const Grid = {
  cell: CFG.CELL, map: new Map(), _keys: [],

  clear(){ this.map.clear(); },

  _key(cx, cz){ return cx * 73856093 ^ cz * 19349663; },

  insert(e){
    const cx = Math.floor(e.x / this.cell), cz = Math.floor(e.z / this.cell);
    const k = this._key(cx, cz);
    let arr = this.map.get(k);
    if (!arr){ arr = []; this.map.set(k, arr); }
    arr.push(e);
  },

  // 遍历以 (x,z) 为中心、半径 r 覆盖到的所有格子中的敌人
  queryCircle(x, z, r, fn){
    const c = this.cell;
    const x0 = Math.floor((x - r) / c), x1 = Math.floor((x + r) / c);
    const z0 = Math.floor((z - r) / c), z1 = Math.floor((z + r) / c);
    for (let cx = x0; cx <= x1; cx++){
      for (let cz = z0; cz <= z1; cz++){
        const arr = this.map.get(this._key(cx, cz));
        if (!arr) continue;
        for (let i = 0; i < arr.length; i++) fn(arr[i]);
      }
    }
  },

  // 环形向外扩张找最近敌人：找到后再多扩一圈保证正确性
  nearest(x, z, maxR){
    const c = this.cell, maxRing = Math.ceil(maxR / c) + 1;
    let best = null, bestD = maxR * maxR, foundRing = -1;
    const ccx = Math.floor(x / c), ccz = Math.floor(z / c);
    for (let ring = 0; ring <= maxRing; ring++){
      if (foundRing >= 0 && ring > foundRing + 1) break;
      const x0 = ccx - ring, x1 = ccx + ring, z0 = ccz - ring, z1 = ccz + ring;
      for (let cx = x0; cx <= x1; cx++){
        for (let cz = z0; cz <= z1; cz++){
          // 只扫描当前环（跳过内部已扫过的格子）
          if (ring > 0 && cx !== x0 && cx !== x1 && cz !== z0 && cz !== z1) continue;
          const arr = this.map.get(this._key(cx, cz));
          if (!arr) continue;
          for (let i = 0; i < arr.length; i++){
            const e = arr[i];
            const dx = e.x - x, dz = e.z - z, d = dx * dx + dz * dz;
            if (d < bestD){ bestD = d; best = e; if (foundRing < 0) foundRing = ring; }
          }
        }
      }
    }
    return best;
  },

  // 最远敌人（重炮僚机用）：数量不大，直接线性扫活跃表由调用方提供
  farthestIn(list, x, z, maxR){
    let best = null, bestD = -1, lim = maxR * maxR;
    for (let i = 0; i < list.length; i++){
      const e = list[i];
      const dx = e.x - x, dz = e.z - z, d = dx * dx + dz * dz;
      if (d <= lim && d > bestD){ bestD = d; best = e; }
    }
    return best;
  }
};

/* ============================================================================
 * [5] World — renderer / scene / camera / 星尘背景 / 地面网格
 * ==========================================================================*/
const World = {
  scene: null, camera: null, renderer: null,
  starA: null, starB: null, grid: null,
  quality: 2,          // 2=全效 1=省拖尾 0=最省
  _camTarget: new THREE.Vector3(),

  init(){
    const canvas = document.getElementById('view');
    this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    this.renderer.setClearColor(0x05060f, 1);

    this.scene = new THREE.Scene();
    this.scene.fog = new THREE.Fog(0x05060f, 46, 78);   // 远处淡出，掩盖刷怪环边界

    this.camera = new THREE.PerspectiveCamera(CFG.CAM_FOV, window.innerWidth / window.innerHeight, 0.5, 220);
    this.camera.position.set(0, CFG.CAM_H, CFG.CAM_H * Math.tan(CFG.CAM_TILT));
    this.camera.lookAt(0, 0, 0);

    this._buildGround();
    this._buildStars();

    window.addEventListener('resize', () => this.onResize());
  },

  // 地面：暗色网格 + 加色发光线，营造星域坐标网感
  _buildGround(){
    const g = new THREE.GridHelper(320, 80, 0x1b3a4a, 0x102430);
    g.material.transparent = true;
    g.material.opacity = 0.5;
    g.material.depthWrite = false;
    g.position.y = -1.2;
    g.renderOrder = -1;
    g.matrixAutoUpdate = false; g.updateMatrix();
    this.grid = g;
    this.scene.add(g);
  },

  // 星尘：程序化星云 + 两层 Points + Kenney 星点广告牌
  _buildStars(){
    this._buildNebula();
    this.starA = this._starLayer(1400, 120, 0.9, 0x9fd8ff, 0.85);
    this.starB = this._starLayer(700,  150, 1.6, 0xa78bfa, 0.55);
    this.starA.position.y = -8; this.starB.position.y = -14;
    this.scene.add(this.starA); this.scene.add(this.starB);
    this._buildStarSprites();
  },

  // 程序化星云：深空底色 + 多团霓虹辉光（加色混合铺在最底层）
  _buildNebula(){
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const g = c.getContext('2d');
    g.fillStyle = '#05060f'; g.fillRect(0, 0, 512, 512);
    const blobs = [
      [ 80,120,170,'120,140,255',0.11],
      [400, 90,190,' 80,200,255',0.10],
      [260,400,210,'180,120,255',0.10],
      [120,360,150,' 60,220,200',0.08],
      [430,330,180,'255,120,200',0.09]
    ];
    for (const [x,y,r,col,a] of blobs){
      const cc = col.trim();
      const grd = g.createRadialGradient(x,y,0,x,y,r);
      grd.addColorStop(0, `rgba(${cc},${a})`);
      grd.addColorStop(1, `rgba(${cc},0)`);
      g.fillStyle = grd; g.fillRect(0, 0, 512, 512);
    }
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true,
      opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(340, 340), mat);
    plane.rotation.x = -Math.PI / 2; plane.position.y = -3; plane.renderOrder = -3;
    this.nebula = plane; this.scene.add(plane);
  },

  // Kenney 星点广告牌：散布于星域，闪烁 + 轻微视差
  _buildStarSprites(){
    this.starField = new THREE.Group();
    this.starSprites = [];
    const keys = ['star1', 'star2', 'star3'];
    for (let i = 0; i < 170; i++){
      const k = keys[(Math.random() * 3) | 0];
      const s = Gfx.billboard(k, 0xffffff, Util.rand(0.6, 2.4),
                              THREE.AdditiveBlending, Util.rand(0.4, 0.9));
      s.position.set(Util.rand(-150, 150), Util.rand(-12, 3), Util.rand(-150, 150));
      s.userData.ph = Math.random() * 6.28;
      s.userData.base = s.material.opacity;
      this.starField.add(s); this.starSprites.push(s);
    }
    this.scene.add(this.starField);
  },

  _starLayer(n, spread, size, color, opacity){
    const pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++){
      pos[i*3]     = Util.rand(-spread, spread);
      pos[i*3 + 1] = Util.rand(-2, 2);
      pos[i*3 + 2] = Util.rand(-spread, spread);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({
      size: size, map: Gfx.tex.star, color: color, transparent: true,
      opacity: opacity, blending: THREE.AdditiveBlending,
      depthWrite: false, sizeAttenuation: true
    });
    const p = new THREE.Points(geo, mat);
    p.frustumCulled = false;
    p.renderOrder = -2;
    return p;
  },

  // 相机平滑跟随玩家；星尘/地面跟着走以制造无限空间错觉
  follow(px, pz, dt){
    const t = this._camTarget;
    t.set(px, CFG.CAM_H, pz + CFG.CAM_H * Math.tan(CFG.CAM_TILT));
    this.camera.position.lerp(t, Util.smooth(CFG.CAM_LAG, dt));
    this.camera.lookAt(this.camera.position.x, 0, this.camera.position.z - CFG.CAM_H * Math.tan(CFG.CAM_TILT));

    // 地面网格按格距吸附，视觉上永远铺满
    this.grid.position.x = Math.round(px / 4) * 4;
    this.grid.position.z = Math.round(pz / 4) * 4;
    this.grid.updateMatrix();
    // 两层星尘不同视差系数
    this.starA.position.x = px * 0.86; this.starA.position.z = pz * 0.86;
    this.starB.position.x = px * 0.72; this.starB.position.z = pz * 0.72;
    // Kenney 星点：轻微视差 + 闪烁
    if (this.starField){
      this.starField.position.x = px * 0.4; this.starField.position.z = pz * 0.4;
      const tt = Game.time;
      for (let i = 0; i < this.starSprites.length; i++){
        const s = this.starSprites[i];
        s.material.opacity = s.userData.base * (0.55 + 0.45 * Math.sin(tt * 1.7 + s.userData.ph));
      }
    }
  },

  // 动态降级：帧时间过长时依次砍特效
  setQuality(q){
    if (q === this.quality) return;
    this.quality = q;
    this.starB.visible = q >= 1;
    this.renderer.setPixelRatio(q >= 1 ? Math.min(window.devicePixelRatio, 2) : 1);
  },

  onResize(){
    this.camera.aspect = window.innerWidth / window.innerHeight;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(window.innerWidth, window.innerHeight);
  },

  render(){ this.renderer.render(this.scene, this.camera); }
};

/* ============================================================================
 * [6] Input — 键盘状态。WASD / 方向键；空格暂停；1/2/3 选卡；F 切阵型
 * ==========================================================================*/
const Input = {
  keys: {}, _once: {},
  init(){
    window.addEventListener('keydown', e => {
      // 防止空格/方向键滚动页面
      if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) >= 0) e.preventDefault();
      const k = e.key.toLowerCase();
      if (!this.keys[k]) this._once[k] = true;
      this.keys[k] = true;
    });
    window.addEventListener('keyup', e => { this.keys[e.key.toLowerCase()] = false; });
    window.addEventListener('blur', () => { this.keys = {}; });
  },
  down(k){ return !!this.keys[k]; },
  // 边沿触发：读取一次后清除
  pressed(k){ if (this._once[k]){ this._once[k] = false; return true; } return false; },
  // 归一化移动轴，写入 out{x,z}
  axis(out){
    let x = 0, z = 0;
    if (this.down('a') || this.down('arrowleft'))  x -= 1;
    if (this.down('d') || this.down('arrowright')) x += 1;
    if (this.down('w') || this.down('arrowup'))    z -= 1;
    if (this.down('s') || this.down('arrowdown'))  z += 1;
    if (x !== 0 && z !== 0){ const inv = 0.7071067; x *= inv; z *= inv; }
    out.x = x; out.z = z;
    return (x !== 0 || z !== 0);
  }
};

/* ============================================================================
 * [7] Player — 属性聚合（基础值 × 被动加成）、移动、无敌帧、受伤
 * ==========================================================================*/
const Player = {
  mesh: null, glow: null, thruster: null,
  x: 0, z: 0, yaw: 0, facing: 0,
  hp: 100, maxHp: 100, shield: 0, maxShield: 3,
  inv: 0,                    // 无敌帧剩余时间
  moving: false,
  _axis: { x: 0, z: 0 },
  buffs: { overdrive: 0 },   // 临时增益剩余时间

  init(){
    const g = new THREE.Group();

    // 玩家战机：真 3D 组合模型（霓虹青），取代扁平精灵
    const shipG = Gfx.build('player').g;
    shipG.scale.setScalar(1.5);
    this.shipG = shipG;
    g.add(shipG);

    // 光晕（内置模型，加色混合）
    this.glow = Gfx.glowSprite(0x22d3ee, 5.2, 0.5);
    shipG.add(this.glow);
    // 引擎尾焰（置于机尾，随朝向更新）
    this.thruster = Gfx.glowSprite(0xf472b6, 2.0, 0.9);
    g.add(this.thruster);
    // 地面投影：让战机踩在星域上
    this.shadow = Gfx.groundShadow(2.3, 0.46);
    g.add(this.shadow);

    this.mesh = g;
    World.scene.add(g);
    this.reset();
  },

  reset(){
    this.x = 0; this.z = 0; this.yaw = 0; this.facing = 0;
    this.maxHp = CFG.P.hp + Progress.passiveLv('hp') * PASSIVES.hp.per;
    this.hp = this.maxHp;
    this.shield = 0; this.inv = 0;
    this.buffs.overdrive = 0;
    this.mesh.position.set(0, 0, 0);
    this.mesh.visible = true;
  },

  /* ---- 派生属性：基础值 × 被动 × 临时增益 ---- */
  get speed(){
    return CFG.P.speed * (1 + Progress.passiveLv('speed') * PASSIVES.speed.per);
  },
  get rateMul(){   // 攻击间隔乘数（越小越快）
    const cd = 1 / (1 + Progress.passiveLv('rate') * PASSIVES.rate.per);
    return this.buffs.overdrive > 0 ? cd / 1.5 : cd;
  },
  get dmgMul(){
    return this.buffs.overdrive > 0 ? 1.5 : 1.0;
  },
  get critC(){ return CFG.P.critC + Progress.passiveLv('crit') * PASSIVES.crit.per; },
  get critD(){ return CFG.P.critD + Progress.passiveLv('crit') * 0.15; },
  get pickR(){
    const wardenBonus = Wingmen.countOf('warden') * 0.15;
    return CFG.P.pickR * (1 + Progress.passiveLv('pick') * PASSIVES.pick.per + wardenBonus);
  },
  get armor(){ return Progress.passiveLv('armor') * PASSIVES.armor.per; },

  // 结算一次伤害（含暴击判定），返回 {dmg, crit}
  rollDamage(base){
    const crit = Math.random() < this.critC;
    const d = base * this.dmgMul * (crit ? this.critD : 1);
    return { dmg: d, crit: crit };
  },

  update(dt){
    // ---- 移动 ----
    const moved = Input.axis(this._axis);
    this.moving = moved;
    if (moved){
      const s = this.speed * dt;
      this.x += this._axis.x * s;
      this.z += this._axis.z * s;
      this.facing = Math.atan2(this._axis.x, this._axis.z);  // 记录朝向供编队使用
    }
    // 世界软边界：越界拉回，避免飞出星域
    const lim = 96;
    this.x = Util.clamp(this.x, -lim, lim);
    this.z = Util.clamp(this.z, -lim, lim);

    // ---- 朝向：机头指向当前射击目标，无目标时指向移动方向 ----
    const tgt = Weapons.currentTarget;
    const wantYaw = tgt ? Math.atan2(tgt.x - this.x, tgt.z - this.z) : this.facing;
    this.yaw += Util.wrapPI(wantYaw - this.yaw) * Util.smooth(11, dt);

    this.mesh.position.set(this.x, 0, this.z);
    this.shipG.rotation.y = this.yaw;

    // 引擎尾焰置于机尾（朝运动反方向），随移动脉动
    this.thruster.position.set(-Math.sin(this.yaw) * 1.25, 0, -Math.cos(this.yaw) * 1.25);
    const tf = this.moving ? Util.rand(1.9, 2.7) : Util.rand(0.7, 1.0);
    this.thruster.scale.set(tf, tf, 1);

    // ---- 无敌帧 & 受击闪烁 ----
    if (this.inv > 0){
      this.inv -= dt;
      this.mesh.visible = (Math.floor(this.inv * 22) & 1) === 0;
    } else {
      this.mesh.visible = true;
    }

    // ---- 临时增益倒计时 ----
    if (this.buffs.overdrive > 0){
      this.buffs.overdrive -= dt;
      this.glow.material.color.setHex(this.buffs.overdrive > 0 ? 0xfbbf24 : 0x22d3ee);
    }
  },

  // 返回是否真的受到了伤害
  takeDamage(raw){
    if (this.inv > 0 || Game.state !== 'PLAYING') return false;
    // 护盾优先抵挡，1 层挡 1 次
    if (this.shield > 0){
      this.shield--;
      this.inv = CFG.P.iframe;
      FX.ring(this.x, this.z, 0x22d3ee, 3.4);
      return false;
    }
    const dmg = Math.max(1, raw - this.armor);   // 护甲为减法减伤，保底 1
    this.hp -= dmg;
    this.inv = CFG.P.iframe;
    FX.ring(this.x, this.z, 0xf43f5e, 2.6);
    Game.shake(0.32);
    if (this.hp <= 0){ this.hp = 0; Game.over(false); }
    return true;
  },

  heal(v){ this.hp = Math.min(this.maxHp, this.hp + v); },
  addShield(n){ this.shield = Math.min(this.maxShield, this.shield + n); }
};

/* ============================================================================
 * [8] FX — 爆炸/冲击环/飘字，全部池化。Sprite + Additive，无后处理。
 * ==========================================================================*/
const FX = {
  pool: null,

  init(){
    this.pool = Pool.create(
      () => {
        const s = Gfx.glowSprite(0xffffff, 1, 1);
        s.visible = false;
        World.scene.add(s);
        return { mesh: s, t: 0, dur: 0.4, s0: 1, s1: 4, alive: false };
      },
      o => { o.t = 0; o.mesh.visible = true; },
      CFG.POOL.fx
    );
    // 击杀碎片粒子池（独立 Sprite，带速度/阻力）
    this.ppool = Pool.create(
      () => {
        const s = Gfx.glowSprite(0xffffff, 1, 1);
        s.visible = false;
        World.scene.add(s);
        return { mesh: s, x:0, z:0, vx:0, vz:0, life:0, max:0.5,
                 s0:0.6, s1:0.05, alive:false };
      },
      o => { o.life = 0; o.mesh.visible = true; },
      CFG.POOL.kill
    );
    // 击杀爆炸：Kenney 火帧动画（独立 Sprite 池）
    this.fpool = Pool.create(
      () => {
        const m = new THREE.SpriteMaterial({ map: Gfx.assetTex('fire00'),
          transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
        const s = new THREE.Sprite(m); s.visible = false; World.scene.add(s);
        return { mesh: s, mat: m, x: 0, z: 0, life: 0, max: 0.45, s0: 3, alive: false };
      },
      o => { o.life = 0; o.mesh.visible = true; },
      CFG.POOL.fx
    );
  },

  // 通用爆散光球
  burst(x, z, color, size, dur){
    const o = this.pool.acquire(); if (!o) return;
    o.mesh.material.color.setHex(color);
    o.mesh.position.set(x, 0.3, z);
    o.s0 = size * 0.35; o.s1 = size; o.dur = dur || 0.36; o.t = 0;
    o.mesh.scale.set(o.s0, o.s0, 1);
    o.mesh.material.opacity = 1;
  },

  // 冲击环（受击/护盾）
  ring(x, z, color, size){ this.burst(x, z, color, size, 0.28); },

  // 火球爆炸：0.45s 内过完 fire00..fire15 十六帧
  boom(x, z, scale){
    const o = this.fpool.acquire(); if (!o) return;
    o.x = x; o.z = z; o.max = 0.45; o.life = o.max;
    o.s0 = (scale || 3) * 1.25;
    o.mesh.position.set(x, 0.4, z);
  },

  // 击杀：火帧爆炸 + 霓虹碎片 + 中心闪光
  kill(x, z, color, scale){
    scale = scale || 3;
    this.boom(x, z, scale);
    const n = Math.min(16, 6 + (scale | 0));
    const boost = scale / 4 + 0.5;
    for (let i = 0; i < n; i++){
      const o = this.ppool.acquire(); if (!o) return;
      const a = Math.random() * Math.PI * 2;
      const sp = Util.rand(3, 9) * boost;
      o.x = x; o.z = z;
      o.vx = Math.sin(a) * sp; o.vz = Math.cos(a) * sp;
      o.max = Util.rand(0.35, 0.62); o.life = o.max;
      o.s0 = Util.rand(0.5, 1.1) * boost; o.s1 = 0.05;
      o.mesh.material.color.setHex(color);
      o.mesh.material.opacity = 1;
      o.mesh.position.set(x, 0.3, z);
      o.mesh.scale.set(o.s0, o.s0, 1);
    }
    this.burst(x, z, color, scale * 1.1, 0.3);
  },

  update(dt){
    const a = this.pool.active;
    for (let i = a.length - 1; i >= 0; i--){
      const o = a[i];
      o.t += dt;
      const k = o.t / o.dur;
      if (k >= 1){ this.pool.release(o); continue; }
      const sc = Util.lerp(o.s0, o.s1, k);
      o.mesh.scale.set(sc, sc, 1);
      o.mesh.material.opacity = 1 - k;
    }
    // 击杀碎片
    const p = this.ppool.active;
    for (let i = p.length - 1; i >= 0; i--){
      const o = p[i];
      o.life -= dt;
      if (o.life <= 0){ this.ppool.release(o); continue; }
      const k = 1 - o.life / o.max;            // 进度 0→1
      o.x += o.vx * dt; o.z += o.vz * dt;
      o.vx *= (1 - dt * 2.2); o.vz *= (1 - dt * 2.2);   // 空气阻力
      const sc = Util.lerp(o.s0, o.s1, k);
      o.mesh.position.set(o.x, 0.3, o.z);
      o.mesh.scale.set(sc, sc, 1);
      o.mesh.material.opacity = 1 - k;
    }
    // 火帧爆炸：按进度切帧
    const f = this.fpool.active;
    for (let i = f.length - 1; i >= 0; i--){
      const o = f[i];
      o.life -= dt;
      if (o.life <= 0){ this.fpool.release(o); continue; }
      const k = 1 - o.life / o.max;                 // 0→1
      const fr = Math.min(15, Math.floor(k * 16));
      const tex = Gfx.assetTex('fire' + String(fr).padStart(2, '0'));
      if (tex && o.mat.map !== tex){ o.mat.map = tex; o.mat.needsUpdate = true; }
      const sc = o.s0 * (0.55 + 0.85 * Math.sin(k * Math.PI));   // 先胀后缩
      o.mesh.scale.set(sc, sc, 1);
      o.mesh.material.opacity = 1 - k * 0.6;
    }
  },

  reset(){ this.pool.releaseAll(); this.ppool.releaseAll(); this.fpool.releaseAll(); }
};

/* ============================================================================
 * [9] Bullets — 玩家弹 / 敌弹 / 导弹
 *   玩家弹与敌弹用 InstancedMesh（同构、量大，1 draw call）；
 *   导弹数量少但需独立朝向与拖尾，用普通 Mesh 池。
 * ==========================================================================*/
const Bullets = {
  pInst: null, eInst: null,          // InstancedMesh
  pPool: null, ePool: null, mPool: null,
  _m: new THREE.Matrix4(), _q: new THREE.Quaternion(),
  _p: new THREE.Vector3(), _s: new THREE.Vector3(1,1,1),

  init(){
    // ---- 玩家子弹：青色加色球 ----
    const pMat = new THREE.MeshBasicMaterial({
      color: 0x67e8f9, transparent: true, opacity: 0.95,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    this.pInst = new THREE.InstancedMesh(Gfx.geo.bullet, pMat, CFG.POOL.pbullet);
    this.pInst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.pInst.frustumCulled = false;       // 整体包围盒不可靠，关闭剔除
    this.pInst.renderOrder = 8;
    this.pInst.count = 0;
    World.scene.add(this.pInst);

    // ---- 敌方子弹：琥珀色 ----
    const eMat = new THREE.MeshBasicMaterial({
      color: 0xfbbf24, transparent: true, opacity: 0.95,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    this.eInst = new THREE.InstancedMesh(Gfx.geo.ebullet, eMat, CFG.POOL.ebullet);
    this.eInst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.eInst.frustumCulled = false;
    this.eInst.renderOrder = 8;
    this.eInst.count = 0;
    World.scene.add(this.eInst);

    // 纯数据池（不含 mesh，渲染交给 InstancedMesh 统一写矩阵）
    const mkBullet = () => ({ x:0, z:0, vx:0, vz:0, dmg:0, life:0, r:0.26,
                              pierce:0, crit:false, alive:false });
    this.pPool = Pool.create(mkBullet, o => { o.pierce = 0; }, CFG.POOL.pbullet);
    this.ePool = Pool.create(mkBullet, null, CFG.POOL.ebullet);

    // ---- 导弹：独立 Mesh（需朝向 + 尾焰）----
    this.mPool = Pool.create(
      () => {
        const g = new THREE.Group();
        const body = new THREE.Mesh(Gfx.geo.missile, Gfx.solidMat(0xf472b6));
        g.add(body);
        const tail = Gfx.glowSprite(0xfbbf24, 1.5, 0.9);
        tail.position.z = -0.6; g.add(tail);
        g.visible = false;
        g.matrixAutoUpdate = false;
        World.scene.add(g);
        return { mesh: g, tail: tail, x:0, z:0, yaw:0, spd:0, dmg:0, blast:0,
                 turn:0, life:0, target:null, straight:0, alive:false };
      },
      o => { o.mesh.visible = true; o.target = null; o.straight = 0.25; },
      CFG.POOL.missile
    );
  },

  /* ---- 发射接口 ---- */
  firePlayer(x, z, yaw, spd, dmg, crit, pierce){
    const b = this.pPool.acquire(); if (!b) return;
    b.x = x; b.z = z;
    b.vx = Math.sin(yaw) * spd; b.vz = Math.cos(yaw) * spd;
    b.dmg = dmg; b.crit = crit; b.life = 2.2; b.r = 0.3; b.pierce = pierce || 0;
  },

  fireEnemy(x, z, yaw, spd, dmg){
    const b = this.ePool.acquire(); if (!b) return;
    b.x = x; b.z = z;
    b.vx = Math.sin(yaw) * spd; b.vz = Math.cos(yaw) * spd;
    b.dmg = dmg; b.life = 4.5; b.r = 0.34;
  },

  fireMissile(x, z, yaw, cfgLv, dmg){
    const m = this.mPool.acquire(); if (!m) return;
    m.x = x; m.z = z; m.yaw = yaw;
    m.spd = 13; m.dmg = dmg; m.blast = cfgLv.blast; m.turn = cfgLv.turn;
    m.life = 5.0;
    m.mesh.position.set(x, 0.2, z);
  },

  update(dt){
    this._updatePlayerBullets(dt);
    this._updateEnemyBullets(dt);
    this._updateMissiles(dt);
  },

  /* ---- 玩家子弹：移动 + 空间哈希查敌 + 命中 ---- */
  _updatePlayerBullets(dt){
    const a = this.pPool.active;
    for (let i = a.length - 1; i >= 0; i--){
      const b = a[i];
      b.x += b.vx * dt; b.z += b.vz * dt;
      b.life -= dt;
      if (b.life <= 0){ this.pPool.release(b); continue; }

      let hit = null;
      Grid.queryCircle(b.x, b.z, b.r + 2.4, e => {
        if (hit || !e.alive) return;
        const dx = e.x - b.x, dz = e.z - b.z, rr = e.r + b.r;
        if (dx*dx + dz*dz <= rr*rr) hit = e;
      });
      if (hit){
        Enemies.damage(hit, b.dmg, b.crit);
        FX.burst(b.x, b.z, 0x67e8f9, 1.6, 0.2);
        if (b.pierce > 0) b.pierce--;         // 穿透：扣次数后继续飞
        else { this.pPool.release(b); continue; }
      }
    }
    this._writeInstanced(this.pInst, a, 1);
  },

  /* ---- 敌方子弹：只与玩家碰撞 ---- */
  _updateEnemyBullets(dt){
    const a = this.ePool.active;
    const px = Player.x, pz = Player.z, pr = CFG.P.radius;
    for (let i = a.length - 1; i >= 0; i--){
      const b = a[i];
      b.x += b.vx * dt; b.z += b.vz * dt;
      b.life -= dt;
      if (b.life <= 0){ this.ePool.release(b); continue; }
      const dx = px - b.x, dz = pz - b.z, rr = pr + b.r;
      if (dx*dx + dz*dz <= rr*rr){
        Player.takeDamage(b.dmg);
        FX.burst(b.x, b.z, 0xfbbf24, 1.8, 0.22);
        this.ePool.release(b);
      }
    }
    this._writeInstanced(this.eInst, a, 1);
  },

  /* ---- 导弹：转向率限制追踪 + 防绕圈 ---- */
  _updateMissiles(dt){
    const a = this.mPool.active;
    for (let i = a.length - 1; i >= 0; i--){
      const m = a[i];
      m.life -= dt;
      if (m.life <= 0){ this._missileBoom(m); continue; }

      // 目标失效则重新索敌
      if (!m.target || !m.target.alive) m.target = Grid.nearest(m.x, m.z, 60);

      if (m.straight > 0){
        m.straight -= dt;                    // 发射后 0.25s 直飞，制造甩尾观感
      } else if (m.target){
        const want = Math.atan2(m.target.x - m.x, m.target.z - m.z);
        const diff = Util.wrapPI(want - m.yaw);
        const maxTurn = m.turn * dt;
        // 防绕圈：目标过近且夹角过大 → 判定追丢，直飞 0.4s 后重锁
        const dx = m.target.x - m.x, dz = m.target.z - m.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        const turnRadius = m.spd / m.turn;
        if (dist < turnRadius && Math.abs(diff) > 1.75){
          m.straight = 0.4; m.target = null;
        } else {
          m.yaw += Util.clamp(diff, -maxTurn, maxTurn);
        }
      }

      m.spd = Math.min(m.spd + 26 * dt, 34);   // 逐渐加速
      m.x += Math.sin(m.yaw) * m.spd * dt;
      m.z += Math.cos(m.yaw) * m.spd * dt;

      m.mesh.position.set(m.x, 0.2, m.z);
      m.mesh.rotation.y = m.yaw;
      m.mesh.updateMatrix();

      // 命中检测
      let hit = null;
      Grid.queryCircle(m.x, m.z, 2.6, e => {
        if (hit || !e.alive) return;
        const dx = e.x - m.x, dz = e.z - m.z, rr = e.r + 0.34;
        if (dx*dx + dz*dz <= rr*rr) hit = e;
      });
      if (hit) this._missileBoom(m);
    }
  },

  // 导弹爆炸：范围伤害
  _missileBoom(m){
    const R = m.blast;
    FX.burst(m.x, m.z, 0xf472b6, R * 2.6, 0.34);
    Grid.queryCircle(m.x, m.z, R, e => {
      if (!e.alive) return;
      const dx = e.x - m.x, dz = e.z - m.z;
      if (dx*dx + dz*dz <= R*R){
        const d = Player.rollDamage(m.dmg);
        Enemies.damage(e, d.dmg, d.crit);
      }
    });
    Game.shake(0.12);
    this.mPool.release(m);
  },

  /* ---- 把活跃数据写入 InstancedMesh 矩阵 ---- */
  _writeInstanced(inst, list, scale){
    const n = list.length;
    for (let i = 0; i < n; i++){
      const b = list[i];
      this._p.set(b.x, 0.25, b.z);
      this._m.compose(this._p, this._q, this._s);
      inst.setMatrixAt(i, this._m);
    }
    inst.count = n;
    if (n > 0) inst.instanceMatrix.needsUpdate = true;
  },

  reset(){
    this.pPool.releaseAll(); this.ePool.releaseAll(); this.mPool.releaseAll();
    this.pInst.count = 0; this.eInst.count = 0;
  }
};

/* ============================================================================
 * [10] Weapons — 四类武器的冷却驱动与开火。自动索敌，玩家只需走位。
 * ==========================================================================*/
const Weapons = {
  cd: { cannon: 0, missile: 0, laser: 0 },
  currentTarget: null,
  _retarget: 0,
  laserBeams: [], laserTimer: 0, laserActive: 0,
  auraMesh: null, auraTick: 0,

  init(){
    // ---- 激光束：3 条预建 Plane，按等级启用 ----
    for (let i = 0; i < 3; i++){
      const m = new THREE.Mesh(Gfx.geo.quad, new THREE.MeshBasicMaterial({
        color: 0x22d3ee, transparent: true, opacity: 0.85,
        blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
      }));
      m.rotation.x = -Math.PI / 2;
      m.visible = false;
      m.renderOrder = 7;
      World.scene.add(m);
      this.laserBeams.push(m);
    }

    // ---- 光环：环形加色面片 ----
    const ringGeo = new THREE.RingGeometry(0.86, 1.0, 48);
    this.auraMesh = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
      color: 0xa78bfa, transparent: true, opacity: 0.5,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
    }));
    this.auraMesh.rotation.x = -Math.PI / 2;
    this.auraMesh.position.y = 0.05;
    this.auraMesh.visible = false;
    this.auraMesh.renderOrder = 6;
    World.scene.add(this.auraMesh);
  },

  reset(){
    this.cd.cannon = 0; this.cd.missile = 0; this.cd.laser = 0;
    this.currentTarget = null; this._retarget = 0;
    this.laserTimer = 0; this.laserActive = 0;
    for (const b of this.laserBeams) b.visible = false;
    this.auraMesh.visible = false;
  },

  update(dt){
    // ---- 索敌缓存：每 0.1s 或目标失效时刷新 ----
    this._retarget -= dt;
    if (this._retarget <= 0 || !this.currentTarget || !this.currentTarget.alive){
      this.currentTarget = Grid.nearest(Player.x, Player.z, 52);
      this._retarget = 0.1;
    }

    this._cannon(dt);
    this._missile(dt);
    this._laser(dt);
    this._aura(dt);
  },

  /* ---- 主炮：扇形多发直射 ---- */
  _cannon(dt){
    const lv = Progress.weaponLv('cannon');
    if (lv <= 0) return;
    const s = Progress.isEvolved('cannon') ? WEAPONS.cannon.evo : WEAPONS.cannon.lv[lv - 1];
    this.cd.cannon -= dt;
    if (this.cd.cannon > 0) return;
    const t = this.currentTarget;
    if (!t) return;

    this.cd.cannon = (1 / s.rate) * Player.rateMul;
    const base = Math.atan2(t.x - Player.x, t.z - Player.z);
    for (let i = 0; i < s.count; i++){
      // 以目标方向为中心均匀铺开
      const off = s.count === 1 ? 0 : (i - (s.count - 1) / 2) * s.spread;
      const d = Player.rollDamage(s.dmg);
      Bullets.firePlayer(Player.x, Player.z, base + off, s.spd, d.dmg, d.crit, s.pierce || 0);
    }
    FX.burst(Player.x + Math.sin(base) * 1.1, Player.z + Math.cos(base) * 1.1, 0x22d3ee, 1.4, 0.12);
  },

  /* ---- 导弹：多枚扇形发射后各自追踪 ---- */
  _missile(dt){
    const lv = Progress.weaponLv('missile');
    if (lv <= 0) return;
    const s = Progress.isEvolved('missile') ? WEAPONS.missile.evo : WEAPONS.missile.lv[lv - 1];
    this.cd.missile -= dt;
    if (this.cd.missile > 0) return;
    if (!this.currentTarget) return;

    this.cd.missile = (1 / s.rate) * Player.rateMul;
    for (let i = 0; i < s.count; i++){
      const spread = (i - (s.count - 1) / 2) * 0.55;
      const d = Player.rollDamage(s.dmg);
      Bullets.fireMissile(Player.x, Player.z, Player.yaw + spread, s, d.dmg);
    }
  },

  /* ---- 激光：周期性开火，持续期间穿透伤害 ---- */
  _laser(dt){
    const lv = Progress.weaponLv('laser');
    if (lv <= 0) return;
    const evo = Progress.isEvolved('laser');
    const s = evo ? WEAPONS.laser.evo : WEAPONS.laser.lv[lv - 1];

    if (this.laserActive > 0){
      // ---- 持续期：每帧结算 DPS ----
      this.laserActive -= dt;
      const beams = s.beams;
      const dmgPerFrame = s.dps * dt * Player.dmgMul;
      for (let i = 0; i < beams; i++){
        const yaw = Player.yaw + i * (Math.PI * 2 / beams);
        const beam = this.laserBeams[i];
        beam.visible = true;
        // 面片中心放在玩家前方 len/2 处
        const cx = Player.x + Math.sin(yaw) * s.len / 2;
        const cz = Player.z + Math.cos(yaw) * s.len / 2;
        beam.position.set(cx, 0.15, cz);
        beam.scale.set(s.w, s.len, 1);
        beam.rotation.z = -yaw;
        beam.material.opacity = 0.55 + 0.4 * (this.laserActive / s.dur);

        // 判定：把敌人投影到光束局部坐标，做矩形碰撞
        const sinY = Math.sin(yaw), cosY = Math.cos(yaw);
        Grid.queryCircle(cx, cz, s.len / 2 + 2.4, e => {
          if (!e.alive) return;
          const dx = e.x - Player.x, dz = e.z - Player.z;
          const along = dx * sinY + dz * cosY;          // 沿光束方向的距离
          const perp  = dx * cosY - dz * sinY;          // 垂直偏移
          if (along > -1 && along < s.len && Math.abs(perp) < s.w / 2 + e.r){
            Enemies.damage(e, dmgPerFrame, false, true);
          }
        });
      }
      for (let i = beams; i < 3; i++) this.laserBeams[i].visible = false;
      if (this.laserActive <= 0) for (const b of this.laserBeams) b.visible = false;
    } else {
      this.laserTimer -= dt;
      if (this.laserTimer <= 0){
        this.laserTimer = s.cd * Player.rateMul;
        this.laserActive = s.dur;
        Game.shake(0.1);
      }
    }
  },

  /* ---- 光环：范围持续伤害 + 减速 / 牵引 ---- */
  _aura(dt){
    const lv = Progress.weaponLv('aura');
    if (lv <= 0){ this.auraMesh.visible = false; return; }
    const s = Progress.isEvolved('aura') ? WEAPONS.aura.evo : WEAPONS.aura.lv[lv - 1];

    this.auraMesh.visible = true;
    this.auraMesh.position.set(Player.x, 0.05, Player.z);
    this.auraMesh.scale.setScalar(s.r);
    this.auraMesh.rotation.z += dt * 0.6;
    this.auraMesh.material.opacity = 0.35 + 0.14 * Math.sin(Game.time * 3);

    const dmgPerFrame = s.dps * dt * Player.dmgMul;
    Grid.queryCircle(Player.x, Player.z, s.r, e => {
      if (!e.alive) return;
      const dx = e.x - Player.x, dz = e.z - Player.z;
      const d2 = dx*dx + dz*dz;
      if (d2 > s.r * s.r) return;
      Enemies.damage(e, dmgPerFrame, false, true);
      e.slow = s.slow;                    // 由 Enemies.update 消费
      if (s.pull !== 0){
        const d = Math.sqrt(d2) || 0.001;
        // pull > 0 向心吸（奇点），< 0 击退
        e.x -= (dx / d) * s.pull * dt;
        e.z -= (dz / d) * s.pull * dt;
      }
    });
  },

  // 估算玩家主武器总 DPS —— 供僚机平衡软上限使用
  estimateDPS(){
    let dps = 0;
    const cl = Progress.weaponLv('cannon');
    if (cl > 0){
      const s = Progress.isEvolved('cannon') ? WEAPONS.cannon.evo : WEAPONS.cannon.lv[cl - 1];
      dps += s.dmg * s.count * s.rate / Player.rateMul;
    }
    const ml = Progress.weaponLv('missile');
    if (ml > 0){
      const s = Progress.isEvolved('missile') ? WEAPONS.missile.evo : WEAPONS.missile.lv[ml - 1];
      dps += s.dmg * s.count * s.rate / Player.rateMul;
    }
    const ll = Progress.weaponLv('laser');
    if (ll > 0){
      const s = Progress.isEvolved('laser') ? WEAPONS.laser.evo : WEAPONS.laser.lv[ll - 1];
      dps += s.dps * s.beams * (s.dur / s.cd);
    }
    const al = Progress.weaponLv('aura');
    if (al > 0){
      const s = Progress.isEvolved('aura') ? WEAPONS.aura.evo : WEAPONS.aura.lv[al - 1];
      dps += s.dps;
    }
    return Math.max(30, dps);
  }
};

/* ============================================================================
 * [11] Enemies — 对象池 + 4 类 AI + 环形刷怪 + 波次成长
 * ==========================================================================*/
const ENEMY_SPRITE = {
  charger: 'e_charger', orbiter: 'e_orbiter', sniper: 'e_sniper',
  splitter: 'e_splitter', mini: 'e_mini', elite: 'e_elite'
};

const Enemies = {
  pool: null, spawnTimer: 0,

  init(){
    this.pool = Pool.create(
      i => {
        const g = new THREE.Group();
        g.visible = false;
        g.matrixAutoUpdate = false;
        World.scene.add(g);
        return {
          mesh: g, body: null, shell: null, glow: null, kind: null,
          x:0, z:0, vx:0, vz:0, hp:0, maxHp:0, dmg:0, spd:0, r:0.7, exp:1,
          yaw:0, flash:0, slow:0, t:0, phase:0, cool:0, dir:1,
          isElite:false, alive:false
        };
      },
      null,
      CFG.POOL.enemy
    );
  },

  // 按类型重建外观（切换 kind 时才重建，避免每次刷怪都 new）
  _dress(e, kind){
    if (e.kind === kind && e.built) return;
    e.kind = kind; e.built = true;
    const c = CFG.E[kind];
    // 清空旧模型（几何共享，不 dispose；仅移除引用）
    while (e.mesh.children.length) e.mesh.remove(e.mesh.children[0]);
    const key = ENEMY_SPRITE[kind] || 'e_charger';
    e.spr = Gfx.shipSprite(key, c.color, c.r * 2.4);
    e.mesh.add(e.spr);
    e.smat = e.spr.material;
    e.baseColor = c.color;
    e.glow = Gfx.glowSprite(c.color, c.r * 3.4, 0.4);
    e.mesh.add(e.glow);
    // 地面投影（随体型缩放）
    e.shadow = Gfx.groundShadow(c.r * 2.2, 0.4);
    e.mesh.add(e.shadow);
  },

  spawn(kind, x, z, hpMul, dmgMul, spdMul, isElite){
    const e = this.pool.acquire(); if (!e) return null;
    const c = CFG.E[kind];
    this._dress(e, kind);
    e.x = x; e.z = z;
    e.maxHp = c.hp * hpMul; e.hp = e.maxHp;
    e.dmg = c.dmg * dmgMul;
    e.spd = c.spd * spdMul;
    e.r = c.r; e.exp = c.exp;
    e.t = 0; e.cool = Util.rand(0, 1.5); e.flash = 0; e.slow = 0;
    e.dir = Math.random() < 0.5 ? 1 : -1;
    e.isElite = !!isElite;
    e.mesh.visible = true;
    e.mesh.scale.setScalar(1.0);
    const col = isElite ? 0xfbbf24 : c.color;   // 精英染金色
    e.baseColor = col;
    e.smat.color.setHex(col);
    e.glow.material.color.setHex(col);
    return e;
  },

  /* ---- 环形刷怪：屏幕外随机角度 ---- */
  spawnWave(dt){
    const w = Game.wave;
    if (Game.bossActive) return;                 // BOSS 战期间由 Boss 模块控制杂兵

    const cap = Math.min(40 + 9 * w, 160);
    if (this.pool.count >= cap) return;

    this.spawnTimer -= dt;
    if (this.spawnTimer > 0) return;
    this.spawnTimer = Math.max(0.18, 1.10 - 0.06 * w);

    const batch = 1 + Math.floor(w / 3);
    const mix = CFG.WAVE_MIX[Math.min(w, CFG.WAVE_MIX.length) - 1];
    const hpMul  = 1 + 0.18 * w + 0.02 * w * w;
    const dmgMul = 1 + 0.09 * w;
    const spdMul = Math.min(1 + 0.015 * w, 1.25);

    for (let i = 0; i < batch; i++){
      if (this.pool.count >= cap) break;
      const kind = Util.pickWeighted(mix);
      const th = Math.random() * Math.PI * 2;
      this.spawn(kind,
        Player.x + Math.cos(th) * CFG.SPAWN_R,
        Player.z + Math.sin(th) * CFG.SPAWN_R,
        hpMul, dmgMul, spdMul, false);
    }
  },

  // 精英：波次开始时生成
  spawnElite(count){
    const w = Game.wave;
    const hpMul = w <= 5 ? 1 : 2.9;    // W5=900 / W10≈2600
    for (let i = 0; i < count; i++){
      const th = Math.random() * Math.PI * 2;
      const e = this.spawn('elite',
        Player.x + Math.cos(th) * CFG.SPAWN_R,
        Player.z + Math.sin(th) * CFG.SPAWN_R,
        hpMul, 1 + 0.09 * w, 1, true);
      if (e){ e.mesh.scale.setScalar(1.0); }
    }
    HUD.waveTip('精 英 来 袭');
  },

  update(dt){
    const a = this.pool.active;
    const px = Player.x, pz = Player.z;

    // 每帧重建空间哈希（O(n)，160 个可忽略）
    Grid.clear();

    for (let i = a.length - 1; i >= 0; i--){
      const e = a[i];
      e.t += dt;

      const dx = px - e.x, dz = pz - e.z;
      const d2 = dx*dx + dz*dz;
      const d = Math.sqrt(d2) || 0.0001;
      const nx = dx / d, nz = dz / d;
      const spd = e.spd * (1 - e.slow);
      e.slow = 0;                                    // 减速每帧由光环重新施加

      /* ---- 分类 AI ---- */
      switch (e.kind){
        case 'charger':
        case 'mini':
        case 'splitter':
          // 直冲：径直扑向玩家
          e.x += nx * spd * dt; e.z += nz * spd * dt;
          break;

        case 'orbiter': {
          // 环绕：远则接近，近则做切向运动，每 3s 反向
          if (e.t > 3){ e.t = 0; e.dir *= -1; }
          if (d > 9){
            e.x += nx * spd * dt; e.z += nz * spd * dt;
          } else {
            const tx = -nz * e.dir, tz = nx * e.dir;   // 切向单位向量
            e.x += (tx * 0.92 + nx * 0.18) * spd * dt;
            e.z += (tz * 0.92 + nz * 0.18) * spd * dt;
          }
          break;
        }

        case 'sniper': {
          // 远程：维持 18 左右距离并开火
          const want = 18;
          if (d > want + 3)      { e.x += nx * spd * dt;       e.z += nz * spd * dt; }
          else if (d < want - 3) { e.x -= nx * spd * dt * 0.8; e.z -= nz * spd * dt * 0.8; }
          else {
            const tx = -nz * e.dir, tz = nx * e.dir;
            e.x += tx * spd * 0.5 * dt; e.z += tz * spd * 0.5 * dt;
          }
          e.cool -= dt;
          if (e.cool <= 0 && d < 34){
            e.cool = 2.2;
            Bullets.fireEnemy(e.x, e.z, Math.atan2(dx, dz), 14, e.dmg);
          }
          break;
        }

        case 'elite': {
          // 精英：追踪 + 周期冲刺 + 环射
          e.cool -= dt;
          if (e.phase > 0){                          // 冲刺中
            e.phase -= dt;
            e.x += nx * spd * 3 * dt; e.z += nz * spd * 3 * dt;
          } else {
            e.x += nx * spd * dt; e.z += nz * spd * dt;
            if (e.cool <= 0){
              e.cool = 3.0;
              e.phase = 0.6;                          // 触发冲刺
              // 每两次冲刺附带一次环射
              if (Math.random() < 0.6){
                for (let k = 0; k < 8; k++)
                  Bullets.fireEnemy(e.x, e.z, k * Math.PI / 4, 12, e.dmg * 0.6);
              }
            }
          }
          break;
        }
      }

      /* ---- 超距传送：防止拖出长队 ---- */
      if (d > CFG.DESPAWN_R){
        const th = Math.random() * Math.PI * 2;
        e.x = px + Math.cos(th) * CFG.SPAWN_R;
        e.z = pz + Math.sin(th) * CFG.SPAWN_R;
      }

      /* ---- 与玩家碰撞 ---- */
      const rr = e.r + CFG.P.radius;
      if (d2 <= rr * rr){
        if (Player.takeDamage(e.dmg) && e.kind === 'charger'){
          e.x -= nx * 2.2; e.z -= nz * 2.2;         // 直冲型命中后弹开
        }
      }

      /* ---- 受击闪白 ---- */
      if (e.flash > 0){
        e.flash -= dt;
        e.smat.color.setHex(e.flash > 0 ? 0xffffff : e.baseColor);
      }

      /* ---- 写入变换（matrixAutoUpdate 已关，需手动）---- */
      e.yaw = Math.atan2(dx, dz);
      e.mesh.position.set(e.x, 0, e.z);
      e.spr.material.rotation = e.yaw + Gfx.SHIP_ROT;
      e.mesh.updateMatrix();

      Grid.insert(e);
    }
  },

  /* ---- 造成伤害。isDot=true 时不弹飘字，避免持续伤害刷屏 ---- */
  damage(e, dmg, crit, isDot){
    if (!e.alive) return;
    e.hp -= dmg;
    if (!isDot) e.flash = 0.08;
    if (e.hp <= 0) this.kill(e);
  },

  kill(e){
    const c = CFG.E[e.kind];
    Game.kills++;

    // 分裂型：死亡裂成 3 只 mini
    if (e.kind === 'splitter'){
      const w = Game.wave;
      const hpMul = 1 + 0.18 * w + 0.02 * w * w;
      for (let i = 0; i < 3; i++){
        const th = Math.random() * Math.PI * 2;
        this.spawn('mini', e.x + Math.cos(th) * 1.4, e.z + Math.sin(th) * 1.4,
                   hpMul, 1 + 0.09 * w, 1, false);
      }
    }

    FX.kill(e.x, e.z, c.color, e.r * 3.0);          // 击杀碎片
    FX.burst(e.x, e.z, c.color, e.r * 4.5, 0.4);    // 中心闪光
    if (e.isElite){
      Game.shake(0.5);
      Loot.dropItem(e.x, e.z, 'nuke');            // 精英必掉全屏清
      Progress.gainEvoCore();
      for (let i = 0; i < 6; i++)
        Loot.dropGem(e.x + Util.rand(-2,2), e.z + Util.rand(-2,2), CFG.GEM.big);
    }
    Loot.onEnemyDeath(e);
    this.pool.release(e);
  },

  // 全屏清（Nuke）
  nukeAll(){
    const a = this.pool.active;
    for (let i = a.length - 1; i >= 0; i--){
      const e = a[i];
      this.damage(e, 400, false);
    }
    Game.shake(0.9);
    FX.burst(Player.x, Player.z, 0xffffff, 60, 0.55);
  },

  reset(){ this.pool.releaseAll(); this.spawnTimer = 0; Grid.clear(); }
};

/* ============================================================================
 * [12] Boss — 三阶段母舰。运行期动态创建，需显式 dispose。
 * ==========================================================================*/
const Boss = {
  obj: null, active: false,
  hp: 0, maxHp: 0, phase: 1,
  x: 0, z: 0, t: 0, cdShoot: 0, cdSummon: 0, cdMissile: 0,
  beams: [], beamAngle: 0,
  // 进场演出
  entering: false, entranceT: 0, entranceDur: 2.8,
  sx: 0, sz: 0, tx: 0, tz: 0, glow: null, warn: null,

  spawn(){
    const w = Game.wave;
    this.maxHp = CFG.BOSS.hp * (Game.endless ? (1 + 0.5 * (w - 15)) : 1);
    this.hp = this.maxHp;
    this.phase = 1; this.t = 0;
    this.cdShoot = 1.2; this.cdSummon = 4; this.cdMissile = 3;

    // ---- 进场演出：从屏幕外滑入，再放大就位 ----
    const th = Math.random() * Math.PI * 2;
    this.tx = Player.x + Math.cos(th) * 22;        // 最终停靠点
    this.tz = Player.z + Math.sin(th) * 22;
    this.sx = Player.x + Math.cos(th) * 54;        // 起始点（屏幕外）
    this.sz = Player.z + Math.sin(th) * 54;
    this.x = this.sx; this.z = this.sz;

    // ---- 造型：核心 + 多层环 + 炮塔环 + 光晕 ----
    const bm = Gfx.buildBoss();
    const g = bm.g;
    g.position.set(this.x, 0, this.z);
    g.scale.setScalar(0.05);                        // 从极小开始
    World.scene.add(g);
    this.obj = { group: g, core: bm.core, coreGlow: bm.coreGlow, hull: bm.hull,
                 rings: bm.rings, ring1: bm.rings[0], ring2: bm.rings[1],
                 turrets: bm.turrets, arcs: bm.arcs };

    // 进场光晕（随接近渐隐）+ 落地预警环（扩散）
    this.glow = Gfx.glowSprite(0xf472b6, 30, 0.0);
    this.glow.position.set(this.tx, 0.2, this.tz);
    World.scene.add(this.glow);
    this.warn = Gfx.glowSprite(0xfbbf24, 4, 0.0);
    this.warn.position.set(this.tx, 0.15, this.tz);
    World.scene.add(this.warn);

    // ---- P2 的两条旋转激光 ----
    for (let i = 0; i < 2; i++){
      const m = new THREE.Mesh(Gfx.geo.quad, new THREE.MeshBasicMaterial({
        color: 0xf472b6, transparent: true, opacity: 0.75,
        blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
      }));
      m.rotation.x = -Math.PI / 2;
      m.visible = false; m.renderOrder = 7;
      World.scene.add(m);
      this.beams.push(m);
    }

    this.entering = true; this.entranceT = 0;
    this.active = true;
    Game.bossActive = true;
    HUD.showBoss(true);
    HUD.waveTip('⚠ 母 舰 降 临');
    Game.shake(1.0);
  },

  update(dt){
    if (!this.active) return;
    this.t += dt;

    // ---- 进场演出 ----
    if (this.entering){
      this.entranceT += dt;
      let k = this.entranceT / this.entranceDur; if (k > 1) k = 1;
      const e = Util.easeOutCubic(k);
      this.x = Util.lerp(this.sx, this.tx, e);
      this.z = Util.lerp(this.sz, this.tz, e);
      const sc = Util.lerp(0.05, 1, e);
      this.obj.group.position.set(this.x, 0, this.z);
      this.obj.group.scale.setScalar(sc);
      this.obj.ring1.rotation.z += dt * 3.0;
      this.obj.ring2.rotation.z -= dt * 2.4;
      this.obj.rings[3].rotation.z -= dt * 0.6;
      this.obj.hull.rotation.y += dt * 0.8;
      this.obj.coreGlow.material.opacity = 0.3 + 0.5 * k * (0.5 + 0.5 * Math.sin(this.t * 5));
      // 进场光晕随接近渐隐 + 落地预警环扩散
      this.glow.material.opacity = 0.6 * (1 - k);
      const ws = Util.lerp(4, 18, k);
      this.warn.scale.set(ws, ws, 1);
      this.warn.material.opacity = 0.55 * Math.sin(Math.min(1, k * 1.5) * Math.PI);
      // 进场尾焰（引擎喷射）
      if (((this.t * 30) | 0) % 2 === 0) FX.burst(this.x, this.z, 0xf472b6, 3, 0.28);
      if (k >= 1){
        this.entering = false;
        this.glow.material.opacity = 0; this.warn.material.opacity = 0;
        FX.burst(this.x, this.z, 0xffffff, 34, 0.5);
        Game.shake(0.8);
        HUD.waveTip('母 舰 已 就 位');
      }
      return;                                       // 演出期间不攻击
    }

    // ---- 阶段切换 ----
    const ratio = this.hp / this.maxHp;
    const newPhase = ratio > 0.66 ? 1 : (ratio > 0.33 ? 2 : 3);
    if (newPhase !== this.phase){
      this.phase = newPhase;
      Game.shake(0.7);
      FX.burst(this.x, this.z, 0xffffff, 26, 0.5);
      HUD.waveTip('阶 段 ' + newPhase);
    }

    const dx = Player.x - this.x, dz = Player.z - this.z;
    const d = Math.sqrt(dx*dx + dz*dz) || 0.001;
    const nx = dx / d, nz = dz / d;
    const spdMul = this.phase === 1 ? 1 : (this.phase === 2 ? 1.3 : 1.5);
    const spd = CFG.BOSS.spd * spdMul;

    // ---- 移动：保持 16 距离绕圈 ----
    if (d > 17){ this.x += nx * spd * dt; this.z += nz * spd * dt; }
    else if (d < 13){ this.x -= nx * spd * dt; this.z -= nz * spd * dt; }
    const tx = -nz, tz = nx;
    this.x += tx * spd * 0.55 * dt; this.z += tz * spd * 0.55 * dt;

    // ---- 攻击模式 ----
    this.cdShoot -= dt; this.cdSummon -= dt; this.cdMissile -= dt;
    const base = Math.atan2(dx, dz);

    if (this.phase === 1){
      if (this.cdShoot <= 0){
        this.cdShoot = 1.2;
        for (let i = -2; i <= 2; i++)                      // 扇形 5 弹
          Bullets.fireEnemy(this.x, this.z, base + i * 0.16, 16, CFG.BOSS.dmg * 0.72);
      }
      if (this.cdSummon <= 0){ this.cdSummon = 8; this._summon('charger', 6); }
    } else if (this.phase === 2){
      // 双旋转激光
      this.beamAngle += dt * 0.7;
      const len = 30, w = 1.2;
      for (let i = 0; i < 2; i++){
        const yaw = this.beamAngle + i * Math.PI;
        const b = this.beams[i];
        b.visible = true;
        b.position.set(this.x + Math.sin(yaw) * len / 2, 0.16, this.z + Math.cos(yaw) * len / 2);
        b.scale.set(w, len, 1);
        b.rotation.z = -yaw;
        // 命中玩家判定
        const sinY = Math.sin(yaw), cosY = Math.cos(yaw);
        const pdx = Player.x - this.x, pdz = Player.z - this.z;
        const along = pdx * sinY + pdz * cosY, perp = pdx * cosY - pdz * sinY;
        if (along > 0 && along < len && Math.abs(perp) < w / 2 + CFG.P.radius){
          Player.takeDamage(45 * dt * 12);   // 接触判定按无敌帧节流，实际每 0.6s 一次
        }
      }
      if (this.cdShoot <= 0){
        this.cdShoot = 1.0;
        for (let i = 0; i < 12; i++)                        // 螺旋 12 弹
          Bullets.fireEnemy(this.x, this.z, this.t * 2 + i * Math.PI / 6, 15, CFG.BOSS.dmg * 0.6);
      }
      if (this.cdSummon <= 0){ this.cdSummon = 9; this._summon('orbiter', 5); }
    } else {
      for (const b of this.beams) b.visible = false;
      if (this.cdShoot <= 0){
        this.cdShoot = 0.8;
        for (let i = 0; i < 20; i++)                        // 环射 20 弹
          Bullets.fireEnemy(this.x, this.z, i * Math.PI / 10 + this.t, 15, CFG.BOSS.dmg * 0.55);
      }
      if (this.cdMissile <= 0){
        this.cdMissile = 3;
        for (let i = -1; i <= 1; i++)
          Bullets.fireEnemy(this.x, this.z, base + i * 0.3, 20, CFG.BOSS.dmg * 1.6);
      }
