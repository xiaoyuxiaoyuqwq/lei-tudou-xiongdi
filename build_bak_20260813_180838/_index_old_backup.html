      if (this.cdSummon <= 0){ this.cdSummon = 10; this._summon('splitter', 3); }
      // 濒死闪红
      this.obj.core.material.color.setHex((Math.floor(this.t * 6) & 1) ? 0xff2244 : 0xf472b6);
    }

    // ---- 与玩家碰撞 ----
    if (d < CFG.BOSS.r + CFG.P.radius) Player.takeDamage(CFG.BOSS.dmg);

    // ---- 被玩家子弹命中：把 BOSS 也塞进空间哈希 ----
    this.obj.group.position.set(this.x, 0, this.z);
    this.obj.ring1.rotation.z += dt * 1.1;
    this.obj.ring2.rotation.z -= dt * 0.8;
    this.obj.rings[3].rotation.z -= dt * 0.25;
    this.obj.hull.rotation.y += dt * 0.3;                       // 装甲舰体缓转
    this.obj.coreGlow.material.opacity = 0.45 + 0.35 * (0.5 + 0.5 * Math.sin(this.t * 4));  // 核心呼吸
    const arcsA = this.obj.arcs;
    for (let i = 0; i < arcsA.length; i++)                      // 能量链接弧脉动
      arcsA[i].material.opacity = 0.35 + 0.45 * Math.abs(Math.sin(this.t * 3 + i * 0.8));

    HUD.updateBoss(this.hp / this.maxHp, this.phase);
  },

  _summon(kind, n){
    const w = Game.wave;
    const hpMul = 1 + 0.18 * w + 0.02 * w * w;
    for (let i = 0; i < n; i++){
      const th = Math.random() * Math.PI * 2;
      Enemies.spawn(kind, this.x + Math.cos(th) * 6, this.z + Math.sin(th) * 6,
                    hpMul * 0.5, 1 + 0.09 * w, 1, false);
    }
  },

  // BOSS 作为可被攻击目标注册进空间哈希（伪敌人接口）
  proxy: null,
  registerToGrid(){
    if (!this.active) return;
    if (!this.proxy) this.proxy = { x:0, z:0, r:CFG.BOSS.r, alive:true, isBoss:true, kind:'elite' };
    this.proxy.x = this.x; this.proxy.z = this.z; this.proxy.alive = true;
    Grid.insert(this.proxy);
  },

  damage(dmg){
    this.hp -= dmg;
    if (this.hp <= 0){ this.hp = 0; this.die(); }
  },

  die(){
    FX.boom(this.x, this.z, 46);                     // BOSS 火球爆炸
    FX.kill(this.x, this.z, 0xf472b6, 42);         // BOSS 爆裂碎片
    FX.kill(this.x, this.z, 0xa78bfa, 30);
    FX.burst(this.x, this.z, 0xffffff, 60, 0.9);
    Game.shake(1.4);
    for (let i = 0; i < 20; i++)
      Loot.dropGem(this.x + Util.rand(-6,6), this.z + Util.rand(-6,6), CFG.GEM.big);
    this.clear();
    Game.bossActive = false;
    Game.onBossDead();
  },

  clear(){
    if (this.obj){
      // 运行期 new 出来的对象需显式释放显存
      this.obj.group.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) o.material.dispose();
      });
      World.scene.remove(this.obj.group);
      this.obj = null;
    }
    if (this.glow){ if (this.glow.material) this.glow.material.dispose(); World.scene.remove(this.glow); this.glow = null; }
    if (this.warn){ if (this.warn.material) this.warn.material.dispose(); World.scene.remove(this.warn); this.warn = null; }
    for (const b of this.beams){
      b.geometry = null;
      if (b.material) b.material.dispose();
      World.scene.remove(b);
    }
    this.beams.length = 0;
    if (this.proxy) this.proxy.alive = false;
    this.active = false;
    HUD.showBoss(false);
  }
};

/* ============================================================================
 * [13] Wingmen — 僚机编队。位置跟随阵型，朝向各自独立索敌。
 *   平衡：总 DPS 软上限 = 玩家主武器 DPS × 25%，超出部分按比例衰减。
 * ==========================================================================*/
const Wingmen = {
  list: [], formation: 0,     // 0=雁形 1=环形 2=纵列
  FORMATION_NAMES: ['雁形阵', '环形阵', '纵列阵'],

  reset(){
    for (const w of this.list) World.scene.remove(w.mesh);
    this.list.length = 0;
    this.formation = 0;
  },

  countOf(type){
    let n = 0;
    for (const w of this.list) if (w.type === type) n++;
    return n;
  },

  add(type){
    if (this.list.length >= CFG.WING.maxCount) return false;
    const t = WINGTYPES[type];
    const g = new THREE.Group();
    // 僚机：真 3D 组合模型，按类型与配色生成
    const shipG = Gfx.build(type, t.color).g;
    shipG.scale.setScalar(1.4);
    g.add(shipG);
    const glow = Gfx.glowSprite(t.color, 2.4, 0.5);
    shipG.add(glow);
    const flame = Gfx.glowSprite(t.color, 1.5, 0.85);
    g.add(flame);
    // 地面投影：mesh 在 y=0.35，投影落回 y≈0.02
    const shadow = Gfx.groundShadow(1.7, 0.4);
    shadow.position.y = -0.33;
    g.add(shadow);
    World.scene.add(g);

    this.list.push({
      type: type, mesh: g, shipG: shipG, thruster: flame, flame: Math.random() * 6.28,
      x: Player.x, z: Player.z, yaw: 0,
      cd: Util.rand(0, 0.6), target: null, retarget: 0
    });
    return true;
  },

  // 阵型站位：返回第 i 架的极坐标偏移（未旋转）
  _slot(i, n, out){
    const C = CFG.WING;
    if (this.formation === 0){
      // 雁形：玩家后方扇形展开
      const ang = Math.PI + (i - (n - 1) / 2) * C.spread;
      const dist = C.dist + 0.15 * i;
      out.a = ang; out.d = dist;
    } else if (this.formation === 1){
      // 环形：均分一周，适合被围攻
      out.a = (i / n) * Math.PI * 2; out.d = C.dist + 0.6;
    } else {
      // 纵列：一字排开跟在后面，正面投影小
      out.a = Math.PI; out.d = C.dist + i * 1.5;
    }
  },

  update(dt){
    const n = this.list.length;
    if (n === 0) return;
    const dpsCap = Weapons.estimateDPS() * CFG.WING.dpsCapRatio;

    // 统计理论总 DPS，超上限则整体衰减（保持僚机占比 ~15-20%）
    let rawDps = 0;
    for (const w of this.list){
      const t = WINGTYPES[w.type];
      rawDps += t.dmg * t.rate;
    }
    const scale = rawDps > dpsCap && rawDps > 0 ? dpsCap / rawDps : 1;

    const slot = { a: 0, d: 0 };
    for (let i = 0; i < n; i++){
      const w = this.list[i];
      const t = WINGTYPES[w.type];
      this._slot(i, n, slot);

      // 阵型整体随玩家朝向旋转
      const ang = slot.a + Player.facing;
      const tx = Player.x + Math.sin(ang) * slot.d;
      const tz = Player.z + Math.cos(ang) * slot.d;

      // 指数平滑跟随（帧率无关）
      const k = Util.smooth(CFG.WING.followSmooth, dt);
      w.x += (tx - w.x) * k;
      w.z += (tz - w.z) * k;

      // ---- 独立索敌 ----
      w.retarget -= dt;
      if (w.retarget <= 0 || !w.target || !w.target.alive){
        w.retarget = 0.15;
        if (t.target === 'near')      w.target = Grid.nearest(w.x, w.z, 40);
        else if (t.target === 'far')  w.target = Grid.farthestIn(Enemies.pool.active, w.x, w.z, 40);
        else w.target = null;
      }

      // 朝向：有目标朝目标，否则朝玩家朝向
      const wantYaw = w.target ? Math.atan2(w.target.x - w.x, w.target.z - w.z) : Player.yaw;
      w.yaw += Util.wrapPI(wantYaw - w.yaw) * Util.smooth(10, dt);

      w.mesh.position.set(w.x, 0.35, w.z);
      w.shipG.rotation.y = w.yaw;
      w.thruster.position.set(-Math.sin(w.yaw) * 0.9, 0, -Math.cos(w.yaw) * 0.9);

      // ---- 引擎尾焰闪烁 + 脉冲 ----
      const fl = w.flame;
      w.thruster.material.opacity = 0.55 + 0.4 * Math.sin(Game.time * 26 + fl)
                                  + 0.1 * Math.sin(Game.time * 53 + fl * 2);
      const fs = 0.7 + 0.45 * Math.abs(Math.sin(Game.time * 20 + fl));
      w.thruster.scale.set(fs, fs, 1);

      // ---- 开火 ----
      w.cd -= dt;
      if (w.cd <= 0){
        if (w.type === 'warden'){
          w.cd = 4.0;
          if (Player.shield < Player.maxShield){
            Player.addShield(1);
            FX.ring(Player.x, Player.z, 0x86efac, 3.0);
          }
        } else if (w.target){
          w.cd = (1 / t.rate) * Player.rateMul;
          const d = Player.rollDamage(t.dmg * scale);
          if (w.type === 'howitzer'){
            // 重炮：发射后命中产生小范围爆炸，用导弹池实现直射弹
            Bullets.firePlayer(w.x, w.z, w.yaw, 22, d.dmg, d.crit, 0);
            FX.burst(w.x, w.z, 0xfbbf24, 1.8, 0.15);
          } else {
            Bullets.firePlayer(w.x, w.z, w.yaw, 28, d.dmg, d.crit, 0);
          }
        }
      }
    }
  },

  cycleFormation(){
    if (this.list.length === 0) return;
    this.formation = (this.formation + 1) % 3;
    HUD.waveTip(this.FORMATION_NAMES[this.formation]);
  }
};

/* ============================================================================
 * [14] Loot — 经验晶体（InstancedMesh + 磁吸）与稀有掉落
 * ==========================================================================*/
const Loot = {
  inst: null, pool: null, itemPool: null,
  _m: new THREE.Matrix4(), _q: new THREE.Quaternion(),
  _p: new THREE.Vector3(), _s: new THREE.Vector3(1,1,1), _c: new THREE.Color(),

  init(){
    const mat = new THREE.MeshBasicMaterial({
      map: Gfx.assetTex('star1'), transparent: true, opacity: 0.98,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    this.inst = new THREE.InstancedMesh(Gfx.geo.gem, mat, CFG.POOL.gem);
    this.inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.inst.frustumCulled = false;
    this.inst.renderOrder = 5;
    this.inst.count = 0;
    // instanceColor 需手动初始化，否则为 null
    this.inst.instanceColor = new THREE.InstancedBufferAttribute(
      new Float32Array(CFG.POOL.gem * 3), 3);
    World.scene.add(this.inst);

    this.pool = Pool.create(
      () => ({ x:0, z:0, val:1, life:0, homing:false, vel:0, spin:0, alive:false }),
      o => { o.homing = false; o.vel = 0; o.life = CFG.GEM.life; o.spin = Math.random() * 6.28; },
      CFG.POOL.gem
    );

    // ---- 稀有道具：独立精灵池（Kenney 图标，醒目）----
    this.itemPool = Pool.create(
      () => {
        const g = new THREE.Group();
        const spr = Gfx.billboard('loot_xp', 0xffffff, 1.8, THREE.NormalBlending, 1);
        g.add(spr);
        const glow = Gfx.glowSprite(0xffffff, 4.0, 0.7);
        g.add(glow);
        g.visible = false;
        World.scene.add(g);
        return { mesh: g, spr: spr, glow: glow, x:0, z:0, kind:'repair', t:0, alive:false };
      },
      o => { o.mesh.visible = true; o.t = 0; },
      CFG.POOL.item
    );
  },

  /* ---- 敌人死亡时的掉落判定 ---- */
  onEnemyDeath(e){
    const w = Game.wave;
    const expVal = e.exp * (1 + 0.10 * w);
    // 按经验值分档
    let v = CFG.GEM.small;
    if (expVal >= 10) v = CFG.GEM.big;
    else if (expVal >= 3) v = CFG.GEM.mid;
    this.dropGem(e.x, e.z, v);

    // ---- 稀有掉落 ----
    const D = CFG.DROP;
    const r = Math.random();
    const lowHp = Player.hp / Player.maxHp < 0.4;
    if (r < D.nuke) this.dropItem(e.x, e.z, 'nuke');
    else if (r < D.nuke + (lowHp ? D.repairLow : D.repair)) this.dropItem(e.x, e.z, 'repair');
    else if (r < 0.05 && Math.random() < D.overdrive * 20) this.dropItem(e.x, e.z, 'overdrive');
    else if (r < 0.06 && Math.random() < D.magnet * 20) this.dropItem(e.x, e.z, 'magnet');
    else if (r < 0.07 && Math.random() < D.barrier * 20) this.dropItem(e.x, e.z, 'barrier');
  },

  dropGem(x, z, val){
    // 场上晶体过多时合并：直接提升新晶体价值而不生成新个体
    if (this.pool.count >= CFG.GEM.maxCount) return;
    const g = this.pool.acquire(); if (!g) return;
    g.x = x + Util.rand(-0.4, 0.4);
    g.z = z + Util.rand(-0.4, 0.4);
    g.val = val;
  },

  ITEM_COLOR: { nuke: 0xffffff, repair: 0x4ade80, overdrive: 0xfbbf24,
                magnet: 0x22d3ee, barrier: 0xa78bfa },
  ITEM_NAME:  { nuke: '轨道轰炸', repair: '纳米修复', overdrive: '超载引擎',
                magnet: '磁力脉冲', barrier: '力场护盾' },
  ITEM_TEX:   { nuke: 'loot_xp', repair: 'loot_heal', overdrive: 'loot_luck',
                magnet: 'loot_magnet', barrier: 'loot_xp' },

  dropItem(x, z, kind){
    const it = this.itemPool.acquire(); if (!it) return;
    it.x = x; it.z = z; it.kind = kind;
    const c = this.ITEM_COLOR[kind];
    const tex = Gfx.assetTex(this.ITEM_TEX[kind] || 'loot_xp');
    it.spr.material.map = tex; it.spr.material.needsUpdate = true;
    it.glow.material.color.setHex(c);
    it.mesh.position.set(x, 0.5, z);
  },

  update(dt){
    this._updateGems(dt);
    this._updateItems(dt);
  },

  _updateGems(dt){
    const a = this.pool.active;
    const px = Player.x, pz = Player.z;
    const R = Player.pickR, R2 = R * R;

    for (let i = a.length - 1; i >= 0; i--){
      const g = a[i];
      g.life -= dt;
      if (g.life <= 0){ this.pool.release(g); continue; }

      const dx = px - g.x, dz = pz - g.z;
      const d2 = dx*dx + dz*dz;

      // homing 单向锁存：一旦进入拾取范围就不再脱离，避免反向跑时抖动
      if (!g.homing && d2 < R2) g.homing = true;

      if (g.homing){
        const d = Math.sqrt(d2) || 0.0001;
        g.vel = Math.min(g.vel + 55 * dt, 45);
        const step = Math.min(g.vel * dt, d);   // 步长不超过剩余距离，防过冲抖动
        g.x += (dx / d) * step;
        g.z += (dz / d) * step;
        if (d < 0.9){
          Progress.gainExp(g.val);
          this.pool.release(g);
          continue;
        }
      }
      g.spin += dt * 3;
    }
    this._writeGems(a);
  },

  _writeGems(a){
    const n = a.length;
    const colAttr = this.inst.instanceColor;
    for (let i = 0; i < n; i++){
      const g = a[i];
      // 临近消失时闪烁（缩放脉动代替 alpha，InstancedMesh 无法逐实例 alpha）
      let sc = g.val === CFG.GEM.big ? 1.5 : (g.val === CFG.GEM.mid ? 1.15 : 0.85);
      if (g.life < CFG.GEM.life - CFG.GEM.blink){
        if ((Math.floor(g.life * 6) & 1) === 0) sc *= 0.35;
      }
      this._p.set(g.x, 0.4, g.z);
      this._q.setFromAxisAngle(Util.TMP.v3.set(0, 1, 0), g.spin);
      this._s.set(sc, sc, sc);
      this._m.compose(this._p, this._q, this._s);
      this.inst.setMatrixAt(i, this._m);

      const hex = g.val === CFG.GEM.big ? 0xfbbf24 : (g.val === CFG.GEM.mid ? 0xf472b6 : 0x22d3ee);
      this._c.setHex(hex);
      colAttr.setXYZ(i, this._c.r, this._c.g, this._c.b);
    }
    this.inst.count = n;
    if (n > 0){
      this.inst.instanceMatrix.needsUpdate = true;
      colAttr.needsUpdate = true;
    }
  },

  _updateItems(dt){
    const a = this.itemPool.active;
    const px = Player.x, pz = Player.z;
    for (let i = a.length - 1; i >= 0; i--){
      const it = a[i];
      it.t += dt;
      it.mesh.position.y = 0.5 + Math.sin(it.t * 2.4) * 0.28;
      const ps = 1 + 0.1 * Math.sin(it.t * 4);
      it.spr.scale.set(1.8 * ps, 1.8 * ps, 1);
      const dx = px - it.x, dz = pz - it.z;
      if (dx*dx + dz*dz < 2.6 * 2.6){
        this._applyItem(it.kind);
        FX.burst(it.x, it.z, this.ITEM_COLOR[it.kind], 8, 0.45);
        HUD.waveTip(this.ITEM_NAME[it.kind]);
        this.itemPool.release(it);
      }
    }
  },

  _applyItem(kind){
    switch (kind){
      case 'nuke':      Enemies.nukeAll(); break;
      case 'repair':    Player.heal(Player.maxHp * 0.3); break;
      case 'overdrive': Player.buffs.overdrive = 8; break;
      case 'barrier':   Player.addShield(2); break;
      case 'magnet': {
        // 全场晶体立即归位
        const a = this.pool.active;
        for (let i = 0; i < a.length; i++){ a[i].homing = true; a[i].vel = 30; }
        break;
      }
    }
  },

  reset(){
    this.pool.releaseAll(); this.itemPool.releaseAll();
    this.inst.count = 0;
  }
};

/* ============================================================================
 * [15] Progress — 等级 / 经验 / 卡池抽取 / 武器与被动等级
 * ==========================================================================*/
const Progress = {
  level: 1, exp: 0, need: 14,
  weapons: {},        // { cannon: 3, ... }
  passives: {},       // { speed: 2, ... }
  wings: {},          // { striker: 2, ... } 每级 = 1 架
  evolved: {},        // { cannon: true }
  evoCores: 0,
  pending: 0,         // 待处理的升级次数（连续升级队列）

  reset(){
    this.level = 1; this.exp = 0; this.need = this.expToNext(1);
    this.weapons = { cannon: 1 };      // 起始武器：主炮 Lv1
    this.passives = {};
    this.wings = {};
    this.evolved = {};
    this.evoCores = 0;
    this.pending = 0;
  },

  expToNext(L){ return Math.floor(8 + 6 * L + 0.55 * Math.pow(L, 1.55)); },
  weaponLv(k){ return this.weapons[k] || 0; },
  passiveLv(k){ return this.passives[k] || 0; },
  isEvolved(k){ return !!this.evolved[k]; },
  gainEvoCore(){ this.evoCores++; },

  gainExp(v){
    this.exp += v;
    // 一次性结算多级（大量经验瞬间到手时）
    while (this.exp >= this.need){
      this.exp -= this.need;
      this.level++;
      this.need = this.expToNext(this.level);
      this.pending++;
    }
    if (this.pending > 0 && Game.state === 'PLAYING') Game.enterLevelUp();
  },

  /* ---- 构建候选卡池 ---- */
  buildPool(){
    const out = [];

    // 1) 武器：已有则升级，未有且槽位未满则新增
    const ownedW = Object.keys(this.weapons).length;
    for (const k in WEAPONS){
      const W = WEAPONS[k];
      const lv = this.weaponLv(k);
      if (this.isEvolved(k)) continue;
      if (lv === 0){
        if (ownedW < 4) out.push({ type:'weapon', key:k, lv:0, rar:'r', w:35,
          icon:W.icon, name:W.name, sub:'新武器',
          desc:this._weaponDesc(k, 1) });
      } else if (lv < 5){
        out.push({ type:'weapon', key:k, lv:lv, rar:'n', w:100 * 1.5,
          icon:W.icon, name:W.name, sub:'Lv' + lv + ' → Lv' + (lv+1),
          desc:this._weaponDesc(k, lv + 1) });
      }
    }

    // 2) 进化卡：武器 Lv5 + 指定被动 Lv5 + 有进化核心
    for (const k in WEAPONS){
      const W = WEAPONS[k];
      if (this.isEvolved(k)) continue;
      if (this.weaponLv(k) >= 5 && this.passiveLv(W.evoPassive) >= 5 && this.evoCores > 0){
        out.push({ type:'evolve', key:k, rar:'v', w:60,
          icon:W.evoIcon, name:W.evoName, sub:'★ 武器进化',
          desc:'消耗 1 枚进化核心，' + W.name + ' 质变为终极形态' });
      }
    }

    // 3) 被动
    for (const k in PASSIVES){
      const P = PASSIVES[k];
      const lv = this.passiveLv(k);
      if (lv >= P.max) continue;
      out.push({ type:'passive', key:k, lv:lv, rar:'n', w:100 * (lv > 0 ? 1.5 : 1),
        icon:P.icon, name:P.name, sub:'Lv' + lv + ' → Lv' + (lv+1),
        desc:P.desc(lv + 1) });
    }

    // 4) 僚机
    const totalWings = Wingmen.list.length;
    if (totalWings < CFG.WING.maxCount){
      for (const k in WINGTYPES){
        const T = WINGTYPES[k];
        out.push({ type:'wing', key:k, rar:'e', w:34,
          icon:T.icon, name:T.name, sub:'僚机 +1（当前 ' + totalWings + '/3）',
          desc:T.desc });
      }
    }

    return out;
  },

  _weaponDesc(k, lv){
    const W = WEAPONS[k], s = W.lv[lv - 1];
    if (k === 'cannon')  return `伤害 ${s.dmg} · 射速 ${s.rate}/s · ${s.count} 连发`;
    if (k === 'missile') return `伤害 ${s.dmg} · 每 ${(1/s.rate).toFixed(1)}s 发射 ${s.count} 枚 · 爆炸 ${s.blast}m`;
    if (k === 'laser')   return `每秒 ${s.dps} 伤害 · 长 ${s.len}m · 每 ${s.cd}s 持续 ${s.dur}s`;
    if (k === 'aura')    return `每秒 ${s.dps} 伤害 · 半径 ${s.r}m` + (s.slow ? ` · 减速 ${s.slow*100}%` : '');
    return '';
  },

  /* ---- 三选一抽卡：抽出即移除，天然去重 ---- */
  rollCards(){
    const pool = this.buildPool();
    const picks = [];
    // 进化卡强制优先展示（稀有且有时效性）
    const evoIdx = pool.findIndex(c => c.type === 'evolve');
    if (evoIdx >= 0) picks.push(pool.splice(evoIdx, 1)[0]);

    while (picks.length < 3 && pool.length > 0){
      let total = 0;
      for (const c of pool) total += c.w;
      let r = Math.random() * total, idx = 0;
      for (let i = 0; i < pool.length; i++){
        r -= pool[i].w;
        if (r <= 0){ idx = i; break; }
      }
      picks.push(pool.splice(idx, 1)[0]);
    }

    // 全满级兜底
    if (picks.length === 0){
      picks.push({ type:'heal', rar:'n', icon:'✚', name:'应急维修',
                   sub:'所有强化已满级', desc:'立即回复 30 点生命' });
    }
    return picks;
  },

  applyCard(c){
    switch (c.type){
      case 'weapon':
        this.weapons[c.key] = (this.weapons[c.key] || 0) + 1;
        break;
      case 'passive':
        this.passives[c.key] = (this.passives[c.key] || 0) + 1;
        if (c.key === 'hp'){                       // 装甲板：提升上限并立即回复
          Player.maxHp = CFG.P.hp + this.passiveLv('hp') * PASSIVES.hp.per;
          Player.heal(PASSIVES.hp.per);
        }
        break;
      case 'evolve':
        this.evolved[c.key] = true;
        this.evoCores--;
        FX.burst(Player.x, Player.z, 0xfbbf24, 22, 0.7);
        break;
      case 'wing':
        this.wings[c.key] = (this.wings[c.key] || 0) + 1;
        Wingmen.add(c.key);
        break;
      case 'heal':
        Player.heal(30);
        break;
    }
    HUD.refreshLoadout();
  }
};

/* ============================================================================
 * [16] HUD — DOM overlay。仅在数值变化时写 DOM，避免每帧 reflow。
 * ==========================================================================*/
const HUD = {
  el: {}, _cache: {},

  init(){
    const id = s => document.getElementById(s);
    this.el = {
      timer: id('timer'), wave: id('wavenum'), kill: id('killnum'),
      exp: id('expbar'), lv: id('lvnum'),
      hp: id('hpfill'), hpn: id('hpnum'), sh: id('shfill'), shn: id('shnum'),
      levelup: id('levelup'), cards: id('cards'), lvsub: id('lvsub'),
      screen: id('screen'), sTitle: id('sTitle'), sSub: id('sSub'), sStats: id('sStats'),
      btnStart: id('btnStart'), btnEndless: id('btnEndless'), help: id('help'),
      wavetip: id('wavetip'), bossbar: id('bossbar'), bosshp: id('bosshp'),
      bossname: id('bossname'), phase: document.querySelectorAll('.pdot'),
      wslots: id('wslots'), pslots: id('pslots'), buffs: id('buffs'), fps: id('fps')
    };
    this.el.btnStart.addEventListener('click', () => Game.start(false));
    this.el.btnEndless.addEventListener('click', () => Game.start(true));
  },

  // 只在值变化时写 DOM
  _set(key, el, val, prop){
    if (this._cache[key] === val) return;
    this._cache[key] = val;
    if (prop === 'w') el.style.width = val;
    else el.textContent = val;
  },

  update(){
    const remain = Game.endless ? Game.time : Math.max(0, CFG.WAVE_TIME * CFG.WAVE_MAX - Game.time);
    this._set('t', this.el.timer, Util.fmtTime(remain));
    this._set('w', this.el.wave, Game.wave);
    this._set('k', this.el.kill, Game.kills);
    this._set('lv', this.el.lv, Progress.level);
    this._set('e', this.el.exp, (Progress.exp / Progress.need * 100).toFixed(1) + '%', 'w');

    const hpPct = Util.clamp(Player.hp / Player.maxHp, 0, 1);
    this._set('hp', this.el.hp, (hpPct * 100).toFixed(1) + '%', 'w');
    this._set('hpn', this.el.hpn, Math.ceil(Player.hp) + '/' + Math.round(Player.maxHp));
    this._set('sh', this.el.sh, (Player.shield / Player.maxShield * 100) + '%', 'w');
    this._set('shn', this.el.shn, Player.shield + ' 层');

    // 增益条
    const buffKey = Player.buffs.overdrive > 0 ? Math.ceil(Player.buffs.overdrive) : 0;
    if (this._cache.buff !== buffKey){
      this._cache.buff = buffKey;
      this.el.buffs.innerHTML = buffKey > 0
        ? '<div class="buff">超载引擎 ' + buffKey + 's</div>' : '';
    }
  },

  setFps(v){ this._set('fps', this.el.fps, v + ' FPS'); },

  refreshLoadout(){
    let wh = '';
    for (const k in WEAPONS){
      const lv = Progress.weaponLv(k);
      if (lv <= 0) continue;
      const evo = Progress.isEvolved(k);
      wh += '<div class="slot' + (evo ? ' evo' : '') + '" title="' +
            (evo ? WEAPONS[k].evoName : WEAPONS[k].name) + '">' +
            (evo ? WEAPONS[k].evoIcon : WEAPONS[k].icon) +
            '<small>' + (evo ? '★' : lv) + '</small></div>';
    }
    for (const w of Wingmen.list){
      wh += '<div class="slot" title="' + WINGTYPES[w.type].name + '">' +
            WINGTYPES[w.type].icon + '</div>';
    }
    this.el.wslots.innerHTML = wh;

    let ph = '';
    for (const k in PASSIVES){
      const lv = Progress.passiveLv(k);
      if (lv <= 0) continue;
      ph += '<div class="slot" title="' + PASSIVES[k].name + '">' + PASSIVES[k].icon +
            '<small>' + lv + '</small></div>';
    }
    this.el.pslots.innerHTML = ph;
  },

  showCards(cards){
    const RAR = { n:['普通','r-n',''], r:['稀有','r-r','c-r'], e:['史诗','r-e','c-e'], v:['进化','r-v','c-v'] };
    let h = '';
    cards.forEach((c, i) => {
      const R = RAR[c.rar] || RAR.n;
      h += '<div class="card ' + R[2] + '" data-i="' + i + '">' +
             '<div class="ico">' + c.icon + '</div>' +
             '<div class="nm">' + c.name + '</div>' +
             '<div class="lv">' + c.sub + '</div>' +
             '<div class="ds">' + c.desc + '</div>' +
             '<div class="rar ' + R[1] + '">' + R[0] + ' · 按 ' + (i+1) + ' 键</div>' +
           '</div>';
    });
    this.el.cards.innerHTML = h;
    this.el.lvsub.textContent = 'LV ' + Progress.level +
      (Progress.pending > 1 ? '　（还有 ' + (Progress.pending - 1) + ' 次升级）' : '');
    // 事件绑定（每次重建卡片都要重绑）
    const nodes = this.el.cards.querySelectorAll('.card');
    nodes.forEach(n => {
      n.addEventListener('click', () => Game.pickCard(parseInt(n.dataset.i, 10)));
    });
    this.el.levelup.classList.remove('hide');
  },

  hideCards(){ this.el.levelup.classList.add('hide'); },

  waveTip(text){
    const el = this.el.wavetip;
    el.textContent = text;
    el.classList.remove('show');
    void el.offsetWidth;          // 强制重排以重启动画
    el.classList.add('show');
  },

  showBoss(on){
    this.el.bossbar.classList.toggle('hide', !on);
    if (on) this.el.bossname.textContent = CFG.BOSS.name;
  },

  updateBoss(ratio, phase){
    this.el.bosshp.style.width = (ratio * 100).toFixed(1) + '%';
    for (let i = 0; i < this.el.phase.length; i++)
      this.el.phase[i].classList.toggle('on', i < phase);
  },

  showScreen(title, sub, stats, showEndless){
    this.el.sTitle.textContent = title;
    this.el.sSub.textContent = sub;
    if (stats){
      this.el.sStats.innerHTML = stats;
      this.el.sStats.classList.remove('hide');
    } else {
      this.el.sStats.classList.add('hide');
    }
    this.el.btnStart.textContent = stats ? '再 来 一 局' : '开 始 出 击';
    this.el.btnEndless.classList.toggle('hide', !showEndless);
    this.el.screen.classList.remove('hide');
  },

  hideScreen(){ this.el.screen.classList.add('hide'); }
};

/* ============================================================================
 * [17] Game — 状态机 + 主循环 + 重开清理
 *   状态：MENU → PLAYING ⇄ LEVELUP → GAMEOVER / VICTORY
 * ==========================================================================*/
const Game = {
  state: 'MENU',
  time: 0, wave: 1, kills: 0,
  endless: false, bossActive: false, bossSpawned: false,
  cards: null,
  shakeAmt: 0,
  _acc: 0, _last: 0, _fpsT: 0, _fpsN: 0, _frameMs: 16,
  unlockedEndless: false,

  init(){
    Gfx.init();
    World.init();
    Input.init();
    FX.init();
    Bullets.init();
    Weapons.init();
    Enemies.init();
    Loot.init();
    Player.init();
    HUD.init();

    // 读取无尽模式解锁状态（file:// 下部分浏览器会抛异常）
    try {
      this.unlockedEndless = localStorage.getItem('sfs_endless') === '1';
    } catch (e){ this.unlockedEndless = false; }

    HUD.showScreen('星潮幸存者', 'S T A R F A L L   S U R V I V O R S', null, this.unlockedEndless);
    this._last = performance.now();
    requestAnimationFrame(t => this.frame(t));
  },

  start(endless){
    this.endless = !!endless;
    this.reset();
    HUD.hideScreen();
    this.state = 'PLAYING';
    HUD.waveTip(this.endless ? '无 尽 模 式' : 'WAVE 1');
  },

  /* ---- 彻底重置：归还所有对象池，不重建场景（避免 shader 重编译卡顿）---- */
  reset(){
    Enemies.reset();
    Bullets.reset();
    Loot.reset();
    FX.reset();
    Wingmen.reset();
    Boss.clear();
    Progress.reset();
    Weapons.reset();
    Player.reset();
    Grid.clear();
    HUD.refreshLoadout();
    HUD._cache = {};
    this.time = 0; this.wave = 1; this.kills = 0;
    this.bossActive = false; this.bossSpawned = false;
    this.shakeAmt = 0; this._acc = 0;
  },

  /* ---- 固定步长逻辑推进 ---- */
  step(dt){
    this.time += dt;

    // ---- 波次推进 ----
    const newWave = Math.min(Math.floor(this.time / CFG.WAVE_TIME) + 1,
                             this.endless ? 999 : CFG.WAVE_MAX);
    if (newWave !== this.wave){
      this.wave = newWave;
      HUD.waveTip('W A V E  ' + this.wave);
      if (CFG.ELITE_WAVES.indexOf(this.wave) >= 0) Enemies.spawnElite(this.wave === 5 ? 1 : 2);
      if (this.endless && this.wave % 5 === 0) Enemies.spawnElite(1 + Math.floor(this.wave / 10));
    }

    // ---- BOSS 出场 ----
    if (!this.endless && this.wave >= CFG.WAVE_MAX && !this.bossSpawned){
      this.bossSpawned = true;
      Boss.spawn();
    }
    if (this.endless && this.wave % 10 === 0 && !this.bossSpawned){
      this.bossSpawned = true; Boss.spawn();
    }

    Player.update(dt);
    Enemies.update(dt);      // 内部会重建空间哈希
    Boss.registerToGrid();   // BOSS 作为伪敌人注册，使其可被武器命中
    Boss.update(dt);
    Weapons.update(dt);
    Wingmen.update(dt);
    Bullets.update(dt);
    Loot.update(dt);
    FX.update(dt);
    Enemies.spawnWave(dt);

    // 相机震屏衰减
    if (this.shakeAmt > 0) this.shakeAmt = Math.max(0, this.shakeAmt - dt * 2.6);
  },

  /* ---- 渲染帧 ---- */
  frame(now){
    requestAnimationFrame(t => this.frame(t));

    let dt = (now - this._last) / 1000;
    this._last = now;
    dt = Math.min(dt, 0.25);                    // 钳制：切标签页回来不炸

    if (this.state === 'PLAYING'){
      this._acc += dt;
      let n = 0;
      const FIXED = 1 / 60;
      while (this._acc >= FIXED && n < 5){ this.step(FIXED); this._acc -= FIXED; n++; }
      if (n >= 5) this._acc = 0;                // 追不上就丢帧，防死亡螺旋
    }

    // 相机跟随 + 震屏
    World.follow(Player.x, Player.z, dt);
    if (this.shakeAmt > 0){
      World.camera.position.x += Util.rand(-1, 1) * this.shakeAmt;
      World.camera.position.z += Util.rand(-1, 1) * this.shakeAmt;
    }

    // ---- 快捷键 ----
    if (this.state === 'LEVELUP'){
      if (Input.pressed('1')) this.pickCard(0);
      else if (Input.pressed('2')) this.pickCard(1);
      else if (Input.pressed('3')) this.pickCard(2);
    }
    if (this.state === 'PLAYING' && Input.pressed('f')) Wingmen.cycleFormation();

    // ---- FPS 统计 + 动态降级 ----
    this._fpsN++;
    this._fpsT += dt;
    if (this._fpsT >= 0.5){
      const fps = Math.round(this._fpsN / this._fpsT);
      this._frameMs = 1000 / Math.max(1, fps);
      HUD.setFps(fps);
      if (this._frameMs > 22 && World.quality > 0) World.setQuality(World.quality - 1);
      else if (this._frameMs < 15 && World.quality < 2) World.setQuality(World.quality + 1);
      this._fpsT = 0; this._fpsN = 0;
    }

    HUD.update();
    World.render();
  },

  shake(v){ this.shakeAmt = Math.min(1.6, this.shakeAmt + v); },

  /* ---- 升级选卡：暂停 → 展示 → 恢复（支持连续升级队列）---- */
  enterLevelUp(){
    this.state = 'LEVELUP';
    this._acc = 0;                               // 清空累积，恢复时不会补跑
    this.cards = Progress.rollCards();
    HUD.showCards(this.cards);
  },

  pickCard(i){
    if (this.state !== 'LEVELUP' || !this.cards || !this.cards[i]) return;
    Progress.applyCard(this.cards[i]);
    Progress.pending--;
    HUD.hideCards();
    if (Progress.pending > 0){
      this.enterLevelUp();                       // 还有待处理升级，继续选
    } else {
      this.state = 'PLAYING';
      this._last = performance.now();            // 防止暂停时长被算进 dt
    }
  },

  onBossDead(){
    if (this.endless){
      this.bossSpawned = false;                  // 无尽模式下 BOSS 可再次出现
      return;
    }
    this.unlockedEndless = true;
    try { localStorage.setItem('sfs_endless', '1'); } catch (e){}
    this.over(true);
  },

  over(win){
    if (this.state === 'GAMEOVER') return;
    this.state = 'GAMEOVER';
    const stats =
      '存活时间<span>' + Util.fmtTime(this.time) + '</span><br>' +
      '抵达波次<span>' + this.wave + ' / ' + (this.endless ? '∞' : CFG.WAVE_MAX) + '</span><br>' +
      '击坠总数<span>' + this.kills + '</span><br>' +
      '最终等级<span>LV ' + Progress.level + '</span><br>' +
      '舰队规模<span>' + Wingmen.list.length + ' 架僚机</span>';
    HUD.showScreen(
      win ? '任 务 达 成' : '战 机 损 毁',
      win ? 'M I S S I O N   C O M P L E T E' : 'S H I P   D E S T R O Y E D',
      stats,
      this.unlockedEndless
    );
  }
};

/* ---- BOSS 伤害转发：Enemies.damage 收到 isBoss 代理时改派给 Boss ---- */
const _origDamage = Enemies.damage.bind(Enemies);
Enemies.damage = function(e, dmg, crit, isDot){
  if (e && e.isBoss){ Boss.damage(dmg); return; }
  _origDamage(e, dmg, crit, isDot);
};

/* ---- 启动 ---- */
window.addEventListener('DOMContentLoaded', () => {
  if (typeof THREE === 'undefined'){
    document.getElementById('sTitle').textContent = 'three.js 加载失败';
    document.getElementById('sSub').textContent = '请检查网络连接后刷新页面';
    return;
  }
  console.log('[Starfall] three.js r' + THREE.REVISION);
  Game.init();
});

// 切后台自动暂停，回来不会因巨大 dt 穿模
document.addEventListener('visibilitychange', () => {
  if (document.hidden && Game.state === 'PLAYING'){
    Game._acc = 0;
  }
  Game._last = performance.now();
});
</script>
</body>
</html>
