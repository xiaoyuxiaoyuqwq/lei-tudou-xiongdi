<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>机型图鉴</title>
<style>
  html,body{margin:0;background:#070a14;overflow:hidden;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  #cv{position:fixed;inset:0}
  /* 顶部标题 + 底部图例，叠加在画布之上 */
  #ui{position:fixed;inset:0;pointer-events:none}
  #head{position:absolute;left:0;right:0;top:26px;text-align:center}
  #title{font-size:30px;font-weight:800;letter-spacing:6px;color:#bff6ff;
    text-shadow:0 0 18px rgba(56,240,255,.55),0 0 4px rgba(56,240,255,.9)}
  #sub{margin-top:6px;font-size:13px;letter-spacing:3px;color:#5f86b8}
  #legend{position:absolute;left:0;right:0;bottom:20px;text-align:center;
    font-size:12.5px;letter-spacing:1px;color:#7e93b8}
  #legend b.n{color:#ff5a6e;font-weight:700}
  #legend b.t{color:#4d9bff;font-weight:700}
  /* 模型标签 */
  #lbl{position:fixed;inset:0;pointer-events:none}
  .cell{position:absolute;transform:translate(-50%,0);text-align:center;white-space:nowrap}
  .cell .nm{font-size:15px;font-weight:700;color:#eaf6ff;text-shadow:0 0 6px rgba(0,0,0,.9)}
  .cell .ky{margin-top:2px;font-size:10.5px;letter-spacing:1px;color:#6b86ad;
    font-family:"SFMono-Regular",Consolas,monospace}
  .cell .chip{display:inline-block;width:8px;height:8px;border-radius:50%;
    margin-right:6px;vertical-align:middle;box-shadow:0 0 6px currentColor}
</style></head><body>
<canvas id="cv"></canvas>
<div id="ui">
  <div id="head"><div id="title">机型图鉴</div><div id="sub">SHIP CATALOG</div></div>
  <div id="legend"><b class="n">● 红箭头 = 机头 (+Z)</b>　·　<b class="t">● 蓝点 = 机尾 (-Z)</b>　·　俯视视角</div>
</div>
<div id="lbl"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="../assets/meshes.js"></script>
<script>
"use strict";
/* 与 index.html 中 Mesh 解码逻辑保持一致的最小副本 */
function b64u8(b64){ const s=atob(b64),n=s.length,u=new Uint8Array(n);
  for(let i=0;i<n;i++)u[i]=s.charCodeAt(i); return u; }
function deq16(b64,range){ const u=b64u8(b64),q=new Int16Array(u.buffer,u.byteOffset,u.byteLength>>1),
  f=new Float32Array(q.length),k=range/32767; for(let i=0;i<q.length;i++)f[i]=q[i]*k; return f; }
function deq8(b64){ const u=b64u8(b64),q=new Int8Array(u.buffer,u.byteOffset,u.byteLength),
  f=new Float32Array(q.length); for(let i=0;i<q.length;i++)f[i]=q[i]/127; return f; }

function build(key, tint){
  const M = window.MESHES[key]; if(!M) return null;
  const g = new THREE.Group();
  const useTint = (tint != null);
  const t = useTint ? new THREE.Color(tint) : null;
  for(const p of M.parts){
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(deq16(p.p, M.ps), 3));
    geo.setAttribute('normal',   new THREE.BufferAttribute(deq8(p.n), 3));
    const iu = b64u8(p.i);
    geo.setIndex(new THREE.BufferAttribute(p.b
      ? new Uint32Array(iu.buffer, iu.byteOffset, iu.byteLength>>2)
      : new Uint16Array(iu.buffer, iu.byteOffset, iu.byteLength>>1), 1));
    geo.computeBoundingSphere();
    let c;
    if (useTint){
      const base = new THREE.Color(p.c[0], p.c[1], p.c[2]);
      const lum = 0.299*base.r + 0.587*base.g + 0.114*base.b;
      c = new THREE.Color(
        base.r*0.45 + t.r*(0.35 + lum*0.5),
        base.g*0.45 + t.g*(0.35 + lum*0.5),
        base.b*0.45 + t.b*(0.35 + lum*0.5));
    } else {
      c = new THREE.Color(p.c[0], p.c[1], p.c[2]);
    }
    const m = new THREE.MeshLambertMaterial({ color: c, emissive: c,
      emissiveIntensity: useTint ? 0.18 : 0.04 });
    g.add(new THREE.Mesh(geo, m));
  }
  return g;
}

/* 底座光晕贴图（径向渐变） */
function glowTex(){
  const s=128, c=document.createElement('canvas'); c.width=c.height=s;
  const g=c.getContext('2d');
  const grd=g.createRadialGradient(s/2,s/2,0, s/2,s/2,s/2);
  grd.addColorStop(0,'rgba(255,255,255,0.95)');
  grd.addColorStop(0.35,'rgba(255,255,255,0.30)');
  grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(c);
}
const GLOW = glowTex();

/* ---- 分类配置（由 shot_catalogs.mjs 通过 evaluateOnNewDocument 注入） ---- */
const CAT_TITLE = window.CAT_TITLE || '机型图鉴';
const CAT_SUB   = window.CAT_SUB   || ('SHIP CATALOG · ' + Object.keys(window.MESHES).length + ' 架');
const CAT_COLS  = window.CAT_COLS  || 5;
const CAT_ITEMS = window.CAT_ITEMS || Object.keys(window.MESHES).map(k => ({ key:k, label:k }));

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('cv'), antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W, H);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x070a14);
scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const d1 = new THREE.DirectionalLight(0xffffff, 1.05); d1.position.set(5, 10, 4); scene.add(d1);
const d2 = new THREE.DirectionalLight(0x66aaff, 0.55); d2.position.set(-6, 4, -5); scene.add(d2);
const d3 = new THREE.DirectionalLight(0xff8a4d, 0.30); d3.position.set(0, 3, -8); scene.add(d3);

document.getElementById('title').textContent = CAT_TITLE;
document.getElementById('sub').textContent   = CAT_SUB;

const items = CAT_ITEMS.filter(it => window.MESHES[it.key]);
const COLS = Math.min(CAT_COLS, items.length);
const GAP = 5.0;
const rows = Math.ceil(items.length / COLS);
const lbl = document.getElementById('lbl');

const halfW = (COLS * GAP) / 2, halfH = (rows * GAP) / 2;
const aspect = W / H;
let vh = halfH + 1.6, vw = vh * aspect;
if (vw < halfW + 1.2) { vw = halfW + 1.2; vh = vw / aspect; }
const cam = new THREE.OrthographicCamera(-vw, vw, vh, -vh, 0.1, 200);
cam.position.set(0, 60, 0); cam.up.set(0, 0, -1); cam.lookAt(0, 0, 0);

items.forEach((it, i) => {
  const cx = (i % COLS - (COLS - 1) / 2) * GAP;
  const cz = (Math.floor(i / COLS) - (rows - 1) / 2) * GAP;
  const g = build(it.key, it.tint); if (!g) return;
  g.position.set(cx, 0, cz);
  scene.add(g);

  // 底座光晕
  const pedColor = (it.tint != null) ? it.tint : 0x2a78ff;
  const ped = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 3.6),
    new THREE.MeshBasicMaterial({ map: GLOW, color: pedColor, transparent:true,
      blending: THREE.AdditiveBlending, depthWrite:false }));
  ped.rotation.x = -Math.PI / 2; ped.position.set(cx, -0.18, cz);
  scene.add(ped);

  // +Z 指示：红色箭头（机头）
  const ar = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.6, 8),
    new THREE.MeshBasicMaterial({ color: 0xff3b50 }));
  ar.rotation.x = Math.PI / 2; ar.position.set(cx, 0.05, cz + 2.15);
  scene.add(ar);
  // -Z 指示：蓝色小球（机尾）
  const bl = new THREE.Mesh(new THREE.SphereGeometry(0.17, 10, 8),
    new THREE.MeshBasicMaterial({ color: 0x3b8bff }));
  bl.position.set(cx, 0.05, cz - 2.15);
  scene.add(bl);

  // 屏幕坐标标签（投影到画布下方）
  const v = new THREE.Vector3(cx, 0, cz); v.project(cam);
  const sx = (v.x * 0.5 + 0.5) * W;
  const sy = (-v.y * 0.5 + 0.5) * H;
  const el = document.createElement('div');
  el.className = 'cell';
  const chip = (it.tint != null)
    ? '<span class="chip" style="color:#' + ('000000'+it.tint.toString(16)).slice(-6) + '"></span>' : '';
  el.innerHTML = '<div class="nm">' + chip + (it.label || it.key) + '</div>' +
                 '<div class="ky">' + it.key + '</div>';
  el.style.left = sx + 'px';
  el.style.top  = (sy + 78) + 'px';
  lbl.appendChild(el);
});

renderer.render(scene, cam);
window.__ready = true;
</script></body></html>
